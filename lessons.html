<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Roots — Leçon</title>
<link rel="icon" type="image/png" href="assets/img/app-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDF3E3;
    --surface:#FFFFFF;
    --surface-2:#F6F1E6;
    --ink:#1B1D22;
    --muted:#5B6068;
    --accent:#E2A13D;
    --accent-ink:#FFFFFF;
    --accent-soft:#FBEBD3;
    --pop:#E0432F;
    --pop-soft:#FBD3CE;
    --good:#1E8E4F;
    --good-soft:#CFEED9;
    --gold:#1B3C39;
    --gold-soft:#E8EEED;
    --line:#E6E8EC;
    --shadow: 0 1px 2px rgba(22,35,44,.06), 0 8px 24px -12px rgba(22,35,44,.18);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E171D; --surface:#16222A; --surface-2:#1D2C35; --ink:#E7EEF1; --muted:#93A8B2;
      --accent:#77AAD3; --accent-ink:#0E171D; --accent-soft:#1F3542; --pop:#FF8368; --pop-soft:#4A2620;
      --good:#5FD68C; --good-soft:#1D3A28;
      --gold:#E4BE6A; --gold-soft:#3A301A; --line:#2A3942;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E171D; --surface:#16222A; --surface-2:#1D2C35; --ink:#E7EEF1; --muted:#93A8B2;
    --accent:#77AAD3; --accent-ink:#0E171D; --accent-soft:#1F3542; --pop:#FF8368; --pop-soft:#4A2620;
    --good:#5FD68C; --good-soft:#1D3A28;
    --gold:#E4BE6A; --gold-soft:#3A301A; --line:#2A3942;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  /* Note : contrairement au prototype d'origine, l'identité visuelle "The
     Roots" (couleurs, fond) reste la même quelle que soit la variante
     (britannique/américaine) choisie — pas de re-thème par drapeau, pour
     rester cohérent avec le reste de l'application. */

  *{box-sizing:border-box;}
  /* Même fond que le reste de l'application (globe/drapeaux en haut,
     villes en bas), fixe derrière tout, jamais coupé : une copie floutée
     comble les bords, une copie nette et entière reste centrée dessus. */
  body::before, body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background-image:url('assets/img/shell-bg.jpg');
    background-repeat:no-repeat; background-position:center;
  }
  body::before{
    background-size:cover;
    filter:blur(46px) saturate(1.15) brightness(0.97);
    transform:scale(1.18);
  }
  body::after{ background-size:contain; }
  html{ background:var(--bg); }
  body{
    margin:0;
    background:transparent;
    color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    padding-inline:16px;
    padding-block:32px;
    min-height:100vh;
    position:relative;
    isolation:isolate;
  }
  h1,h2,h3{ font-family:"Sora", ui-sans-serif, sans-serif; text-wrap:balance; margin:0; line-height:1.15; font-weight:700; }
  .wrap{ max-width:640px; margin-inline:auto; display:flex; flex-direction:column; gap:18px; }

  .masthead{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{ font-family:"Sora", sans-serif; font-weight:800; font-size:1.5rem; letter-spacing:-0.01em; }
  .brand .tagline{ font-weight:600; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .route-chip{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 14px 6px 8px; box-shadow:var(--shadow); font-weight:600; font-size:.78rem; letter-spacing:.01em; color:var(--muted); }
  .route-chip .flags{ font-size:1rem; line-height:1; }
  .route-chip b{ color:var(--ink); font-weight:600; }

  .itinerary{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .itinerary[hidden]{ display:none; }
  .leg{ display:flex; flex-direction:column; gap:6px; align-items:center; }
  .leg .dot{ width:100%; height:5px; border-radius:3px; background:var(--line); }
  .leg.done .dot{ background:var(--accent); }
  .leg.active .dot{ background:var(--pop); }
  .leg .label{ font-weight:600; font-size:.62rem; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); text-align:center; }
  .leg.active .label{ color:var(--pop); font-weight:600; }
  .leg.done .label{ color:var(--accent); }

  /* Encadré transparent (verre dépoli), pour rester cohérent avec le
     reste de l'application : plus de pavé blanc plein derrière la leçon,
     le décor se devine flouté derrière, le texte garde un léger halo pour
     rester lisible. */
  .card{
    position:relative;
    background: rgba(255,255,255,0.40);
    backdrop-filter: blur(12px) saturate(1.15);
    -webkit-backdrop-filter: blur(12px) saturate(1.15);
    border: 1px solid rgba(255,255,255,0.55);
    border-radius:var(--radius);
    box-shadow: 0 8px 20px rgba(20,20,30,0.07), 0 1px 0 rgba(255,255,255,0.6) inset;
    padding:28px 24px 24px;
    overflow:hidden;
    color: var(--ink);
    text-shadow: 0 1px 2px rgba(255,255,255,.4);
  }
  .postmark{ position:absolute; top:16px; right:16px; width:52px; height:52px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.56rem; color:var(--muted); text-align:center; line-height:1.15; transform:rotate(-8deg); flex-direction:column; opacity:.8; }
  .eyebrow{ font-weight:700; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .screen-title{ font-size:1.55rem; max-width:80%; }
  .lede{ color:var(--muted); margin-top:8px; font-size:.91rem; max-width:52ch; }
  .step-count{ font-weight:600; font-size:.68rem; color:var(--muted); margin-top:2px; }

  .vocab-list{ display:flex; flex-direction:column; gap:8px; }
  .vocab-block-title{ font-family:"Sora", sans-serif; font-weight:700; font-size:.78rem; letter-spacing:.03em; text-transform:uppercase; color:var(--accent); margin:14px 0 2px; }
  .vocab-block-title:first-child{ margin-top:0; }
  .vocab-block-heading{ font-family:"Sora", sans-serif; font-weight:700; font-size:.82rem; letter-spacing:.03em; text-transform:uppercase; color:var(--accent); margin-top:10px; }
  .vocab-dots{ display:flex; gap:6px; margin-top:8px; }
  .vocab-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .vocab-dot.active{ background:var(--accent); width:18px; border-radius:4px; }
  .vocab-row{ background:var(--surface-2); border-radius:12px; padding:10px 12px; }
  .vocab-main{ display:flex; align-items:center; gap:10px; }
  .vocab-row .say{ flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--accent); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s ease, background .12s ease; }
  .vocab-row .say:hover{ background:var(--accent-soft); }
  .vocab-row .say:active{ transform:scale(.92); }
  .vocab-row .words{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  .vocab-row .en{ font-weight:700; font-size:1rem; }
  .vocab-row .ipa{ font-family:"IBM Plex Mono", monospace; font-size:.7rem; color:var(--muted); }
  .vocab-row .fr{ font-weight:600; font-size:.82rem; color:var(--accent); flex:0 0 auto; }
  .note-toggle{ flex:0 0 auto; background:none; border:none; color:var(--gold); font-size:.95rem; cursor:pointer; padding:4px; }
  .note-panel{ font-size:.82rem; color:var(--ink); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .note-panel b{ color:var(--gold); }

  .culture-note-card{ margin-top:16px; background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius:14px; padding:13px 15px; }
  .culture-note-head{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:.86rem; color:var(--accent); }
  .culture-note-icon{ font-size:1.05rem; }
  .culture-note-text{ font-size:.83rem; color:var(--ink); margin-top:7px; line-height:1.5; }
  .culture-note-text b{ color:var(--accent); }

  .why{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .why-toggle{ align-self:flex-start; display:flex; align-items:center; gap:6px; background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); color:var(--gold); font-family:"Manrope", sans-serif; font-weight:600; font-size:.82rem; border-radius:999px; padding:7px 14px; cursor:pointer; }
  .why-toggle .chev{ transition:transform .15s ease; font-size:.7rem; }
  .why-toggle[aria-expanded="true"] .chev{ transform:rotate(180deg); }
  .why-panel{ background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); border-radius:12px; padding:11px 14px; font-size:.86rem; }
  .why-panel b{ color:var(--gold); }
  .why-inline{ display:flex; gap:9px; background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); border-radius:12px; padding:11px 14px; margin-top:12px; font-size:.85rem; }
  .why-inline .icon{ flex:0 0 auto; }

  .bank{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; min-height:44px; }
  .chip-btn{ font-family:"Manrope", sans-serif; font-weight:700; font-size:.92rem; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:8px 14px; cursor:pointer; }
  .chip-btn:hover{ border-color:var(--accent); }
  .chip-btn:disabled{ opacity:.35; cursor:default; }
  .answer-row{ display:flex; flex-wrap:wrap; gap:8px; min-height:46px; border:1px dashed var(--line); border-radius:10px; padding:8px; margin-top:10px; }
  .answer-row .chip-btn{ background:var(--accent-soft); border-color:var(--accent); }
  .round-tag{ font-weight:700; font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }

  .conj-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .conj-item{ background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:.86rem; color:var(--muted); }
  .conj-item b{ font-family:"Sora", sans-serif; font-weight:700; font-size:.94rem; display:block; color:var(--ink); margin-bottom:2px; }
  .conj-item .ctr{ color:var(--accent); }
  @media (max-width:480px){ .conj-grid{ grid-template-columns:1fr; } }

  .dialogue{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .bubble-row{ display:flex; gap:8px; align-items:flex-end; }
  .bubble-row.you{ flex-direction:row-reverse; }
  .avatar{ width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:.82rem; font-weight:700; flex:0 0 auto; }
  .bubble-row.you .avatar{ background:var(--gold-soft); color:var(--gold); }
  .bubble{ max-width:78%; padding:9px 13px; border-radius:16px; background:var(--surface-2); border-bottom-left-radius:4px; }
  .bubble-row.you .bubble{ background:var(--accent-soft); border-bottom-left-radius:16px; border-bottom-right-radius:4px; }
  .bubble .en{ font-weight:700; font-size:.92rem; display:block; }
  .bubble .fr{ font-size:.74rem; color:var(--muted); display:block; margin-top:3px; }

  .mini-check{ background:var(--surface-2); border-radius:12px; padding:14px; margin-top:12px; }
  .mini-q{ font-weight:700; font-size:.94rem; margin-bottom:8px; }
  .mini-opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .mini-opt{ font-family:"Manrope", sans-serif; font-weight:600; font-size:.86rem; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px 12px; cursor:pointer; }
  .mini-opt.correct{ background:var(--good-soft); border:2px solid var(--good); color:var(--ink); font-weight:700; }
  .mini-opt.incorrect{ background:var(--pop-soft); border:2px solid var(--pop); color:var(--ink); text-decoration:line-through; text-decoration-color:var(--pop); }
  .mini-opt .opt-icon{ font-weight:800; }
  .mini-opt.correct .opt-icon{ color:var(--good); }
  .mini-opt.incorrect .opt-icon{ color:var(--pop); }
  .mini-opt:disabled{ cursor:default; }
  .mini-fb{ font-size:.78rem; color:var(--muted); margin-top:6px; }

  .memgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .mcard{ aspect-ratio:1/.82; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; font-size:.84rem; font-weight:700; cursor:pointer; user-select:none; transition:background .15s ease, border-color .15s ease, transform .1s ease; }
  .mcard .face{ display:none; }
  .mcard.flipped .face{ display:block; }
  .mcard.flipped .back{ display:none; }
  .mcard .back{ font-family:"Sora", sans-serif; font-size:1.3rem; color:var(--muted); }
  .mcard.matched{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); cursor:default; }
  .mcard:active{ transform:scale(.97); }
  .game-stats{ display:flex; gap:16px; margin-top:12px; font-family:"IBM Plex Mono", monospace; font-size:.78rem; color:var(--muted); }
  .game-stats b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  .q-progress{ font-family:"IBM Plex Mono", monospace; font-size:.72rem; color:var(--muted); letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .q-cat{ display:inline-flex; align-items:center; gap:4px; font-family:"Manrope",sans-serif; font-weight:700; font-size:.66rem; letter-spacing:.04em; text-transform:uppercase; padding:3px 10px; border-radius:999px; }
  .q-cat.oral{ background:var(--accent-soft); color:var(--accent); }
  .q-cat.ecrit{ background:var(--gold-soft); color:var(--gold); }
  .q-cat.comprehension{ background:var(--pop-soft); color:var(--pop); }
  .q-audio{ display:flex; align-items:center; gap:10px; margin-top:10px; background:var(--surface-2); border-radius:12px; padding:10px 12px; }
  .q-audio-btn{ flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--accent); font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .q-audio-btn:hover{ background:var(--accent-soft); }
  .q-audio-hint{ font-size:.8rem; color:var(--muted); font-weight:600; }
  .q-passage{ background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 12px 12px 0; padding:12px 14px; margin-top:8px; font-size:.92rem; line-height:1.5; }
  .gloss-box{ background:var(--gold-soft); border-radius:12px; padding:10px 12px; margin:10px 0 14px; }
  .gloss-title{ font-weight:700; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); margin-bottom:6px; }
  .gloss-item{ font-size:.86rem; margin-top:3px; }
  .gloss-item b{ color:var(--ink); }
  .newword{ color:var(--pop); font-weight:700; text-decoration:underline; text-decoration-color:var(--pop-soft); text-underline-offset:3px; }
  .gloss-word{ border-bottom:2px dotted var(--accent); cursor:pointer; position:relative; }
  .gloss-word.active{ background:var(--accent-soft); border-radius:3px; }
  .gloss-word.active::after{
    content:attr(data-fr);
    position:absolute; left:50%; bottom:100%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:.72rem; font-weight:700;
    padding:5px 9px; border-radius:7px; white-space:nowrap; margin-bottom:6px;
    box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:5;
  }
  .q-text{ font-size:1.1rem; font-weight:700; margin-top:6px; }
  .options{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .opt{ text-align:left; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:.94rem; font-family:inherit; color:var(--ink); cursor:pointer; }
  .opt:hover{ border-color:var(--accent); }
  .opt.correct{ background:var(--good-soft); border:2px solid var(--good); color:var(--ink); font-weight:700; }
  .opt.incorrect{ background:var(--pop-soft); border:2px solid var(--pop); color:var(--ink); text-decoration:line-through; text-decoration-color:var(--pop); }
  .opt .opt-icon{ font-weight:800; }
  .opt.correct .opt-icon{ color:var(--good); }
  .opt.incorrect .opt-icon{ color:var(--pop); }
  .opt:disabled{ cursor:default; }

  .score-band{ display:flex; align-items:baseline; gap:10px; margin:10px 0 4px; }
  .score-band .big{ font-family:"Sora", sans-serif; font-weight:800; font-size:3rem; color:var(--accent); font-variant-numeric:tabular-nums; }
  .score-band .of{ font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:1rem; }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .stat{ background:var(--surface-2); border-radius:12px; padding:12px; text-align:center; }
  .stat .n{ font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:1.15rem; font-variant-numeric:tabular-nums; }
  .stat .l{ font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .recap{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .recap-item{ display:flex; gap:10px; font-size:.86rem; align-items:flex-start; }
  .recap-item .tick{ flex:0 0 auto; }
  .recap-item.miss .tick{ color:var(--pop); font-weight:800; }
  .recap-item.hit .tick{ color:var(--good); font-weight:800; }
  .bilan-retry{ margin-top:16px; padding:12px 14px; background:var(--pop-soft); border:2px solid var(--pop); border-radius:12px; font-size:.86rem; line-height:1.4; }
  .gc-recap-toggle{ margin-top:16px; }
  .gc-recap-toggle summary{ cursor:pointer; color:var(--accent); font-weight:700; font-size:.86rem; list-style:none; padding:4px 0; }
  .gc-recap-toggle summary::-webkit-details-marker{ display:none; }
  .gc-recap-toggle summary::before{ content:"▸ "; }
  .gc-recap-toggle[open] summary::before{ content:"▾ "; }
  .gc-recap-toggle .recap{ margin-top:12px; }

  .controls{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .btn{ font-family:"Manrope", sans-serif; font-weight:700; font-size:.96rem; border-radius:12px; padding:12px 22px; border:1px solid transparent; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); margin-left:auto; }
  .btn-primary:disabled{ opacity:.4; cursor:default; }
  .btn-ghost{ background:transparent; color:var(--muted); border-color:var(--line); }
  .btn:focus-visible, .chip-btn:focus-visible, .opt:focus-visible, .mcard:focus-visible, .say:focus-visible, .why-toggle:focus-visible, .mini-opt:focus-visible, .note-toggle:focus-visible{ outline:2px solid var(--pop); outline-offset:2px; }
  .hint{ font-weight:600; font-size:.72rem; color:var(--muted); text-align:center; }

  .variant-pick{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .variant-btn{ display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; text-align:left; font-family:"Manrope", sans-serif; }
  .variant-btn:hover{ border-color:var(--accent); }
  .variant-btn .vflag{ font-size:1.6rem; }
  .variant-btn .vtext b{ display:block; font-family:"Sora", sans-serif; font-size:1rem; color:var(--ink); }
  .variant-btn .vtext span{ font-size:.78rem; color:var(--muted); }
  .variant-switch{ margin-top:10px; background:none; border:none; color:var(--accent); font-weight:600; font-size:.8rem; cursor:pointer; padding:0; }

  .pron-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .pron-row{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:12px; padding:10px 12px; }
  .pron-row .txt{ flex:1; min-width:0; }
  .pron-row .en{ font-weight:700; font-size:.94rem; }
  .pron-row .fr{ display:block; font-size:.76rem; color:var(--accent); font-weight:600; margin-top:2px; }
  .reading-block{ background:var(--surface-2); border-radius:14px; padding:16px 18px; margin:6px 0 14px; font-size:.98rem; line-height:1.85; }
  .reading-block .sent{ cursor:pointer; border-radius:4px; padding:0 2px; }
  .reading-block .sent:hover{ background:var(--accent-soft); }
  .reading-block .sent:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .mic-btn{ flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; width:38px; height:38px; font-size:1rem; cursor:pointer; color:var(--ink); }

  // ---------- Dictionnaire cumulatif (pour la traduction au clic dans les textes de lecture) ----------
  // Fusionne tout le vocabulaire (VOCAB_L1..L12) et tous les glossaires (GLOSS_L1..L12) déjà écrits
  // dans l'appli, pour que n'importe quel mot déjà enseigné (dans cette leçon ou une leçon antérieure)
  // reste traduisible au clic dans n'importe quel texte de lecture, sans dépendre d'une liste
  // "mots à connaître" ressaisie à la main à chaque leçon.
  var GLOSS_DICT = null;
  function buildGlossDict(){
    if(GLOSS_DICT) return GLOSS_DICT;
    var dict = {};
    function addEntry(enRaw, frRaw){
      if(!enRaw || !frRaw) return;
      var enClean = enRaw.replace(/\s*\([^)]*\)/g, "").trim();
      var frClean = frRaw.replace(/\s*\([^)]*\)/g, "").trim();
      var ens = enClean.split("/").map(function(x){ return x.trim(); });
      var frs = frClean.split("/").map(function(x){ return x.trim(); });
      ens.forEach(function(e, i){
        var val = frs[i] || frs[0];
        var key = e.toLowerCase();
        if(key && !dict[key]) dict[key] = val;
        var bare = key.replace(/^to\s+/, "");
        if(bare !== key && !dict[bare]) dict[bare] = val;
      });
    }
    var vocabArrays = [VOCAB_L1,VOCAB_L2,VOCAB_L3,VOCAB_L4,VOCAB_L5,VOCAB_L6,VOCAB_L7,VOCAB_L8,VOCAB_L9,VOCAB_L10,VOCAB_L11,VOCAB_L12];
    var glossArrays = [GLOSS_L1,GLOSS_L2,GLOSS_L3,GLOSS_L4,GLOSS_L5,GLOSS_L6,GLOSS_L7,GLOSS_L8,GLOSS_L9,GLOSS_L10,GLOSS_L11,GLOSS_L12,GLOSS_COMMON];
    vocabArrays.forEach(function(arr){ (arr||[]).forEach(function(v){ addEntry(v.en, v.fr); }); });
    glossArrays.forEach(function(arr){ (arr||[]).forEach(function(g){ addEntry(g.en, g.fr); }); });
    GLOSS_DICT = dict;
    return dict;
  }
  function lookupPhrase(dict, phrase){
    if(dict[phrase]) return dict[phrase];
    if(phrase.slice(-3) === "ing" && dict[phrase.slice(0,-3)]) return dict[phrase.slice(0,-3)];
    if(phrase.slice(-3) === "ing" && dict[phrase.slice(0,-3)+"e"]) return dict[phrase.slice(0,-3)+"e"];
    if(phrase.slice(-2) === "es" && dict[phrase.slice(0,-2)]) return dict[phrase.slice(0,-2)];
    if(phrase.slice(-1) === "s" && dict[phrase.slice(0,-1)]) return dict[phrase.slice(0,-1)];
    return null;
  }
  // Découpe une phrase et enveloppe chaque mot/expression reconnu(e) du dictionnaire cumulatif
  // dans un <span> cliquable qui affiche sa traduction (jusqu'à 3 mots, le plus long d'abord,
  // pour ne jamais traduire un fragment d'une expression composée comme "meet up").
  function glossifySentence(s){
    var dict = buildGlossDict();
    var tokens = s.match(/[A-Za-z'-]+|[^A-Za-z'-]+/g) || [s];
    var wordIdxs = [];
    tokens.forEach(function(t, i){ if(/[A-Za-z]/.test(t)) wordIdxs.push(i); });
    var used = {};
    var htmlTokens = tokens.map(function(){ return null; });
    for(var wi = 0; wi < wordIdxs.length; wi++){
      if(used[wordIdxs[wi]]) continue;
      for(var span = 3; span >= 1; span--){
        if(wi + span > wordIdxs.length) continue;
        var idxs = wordIdxs.slice(wi, wi+span);
        if(idxs.some(function(ix){ return used[ix]; })) continue;
        var phrase = idxs.map(function(ix){ return tokens[ix]; }).join(" ").toLowerCase();
        var fr = lookupPhrase(dict, phrase);
        if(fr){
          var startTok = idxs[0], endTok = idxs[idxs.length-1];
          var display = tokens.slice(startTok, endTok+1).join("");
          var frEsc = fr.replace(/"/g, "&quot;");
          htmlTokens[startTok] = '<span class="gloss-word" data-fr="'+frEsc+'">'+display+'</span>';
          for(var k = startTok+1; k <= endTok; k++){ htmlTokens[k] = ""; used[k] = true; }
          used[idxs[0]] = true;
          break;
        }
      }
    }
    return tokens.map(function(t, i){ return htmlTokens[i] !== null ? htmlTokens[i] : t; }).join("");
  }

  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  var micStream = null;
  var canRecord = typeof MediaRecorder !== "undefined";
  function requestMicAccess(onDone){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      onDone(false, "unsupported");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      micStream = stream; // gardé ouvert pour pouvoir réécouter chaque tentative
      onDone(true);

  function attemptPronunciation(expected, statusEl, micBtn, replayBtn){
    if(!micSupported || !micStream){
      statusEl.textContent = "—";
      statusEl.title = "Autorise d'abord le micro ci-dessus";
      return;
    }
    var prevLabel = micBtn.textContent;
    micBtn.disabled = true;
    micBtn.textContent = "🎙️";
    statusEl.textContent = "…";

    // Enregistrement pour pouvoir se réécouter
    var recorder = null, chunks = [];
    if(canRecord){
      try{
        recorder = new MediaRecorder(micStream);
        recorder.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
        recorder.onstop = function(){
          if(chunks.length){
            var blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
            var url = URL.createObjectURL(blob);
            replayBtn.disabled = false;
            replayBtn.onclick = function(){ new Audio(url).play(); };
          }
        };
        recorder.start();
      }catch(e){ recorder = null; }
    }

    function finish(ok){
      statusEl.textContent = ok === null ? "—" : (ok ? "✓" : "✗");
      statusEl.className = "pron-status" + (ok === true ? " ok" : ok === false ? " bad" : "");
      micBtn.disabled = false;
      micBtn.textContent = prevLabel;
      if(recorder && recorder.state !== "inactive") recorder.stop();
    }

    try{
      var rec = new SpeechRec();
      rec.lang = state.variant === "us" ? "en-US" : "en-GB";
      rec.maxAlternatives = 3;
      var finished = false;
      rec.onresult = function(e){
        finished = true;
        var said = (e.results[0][0].transcript || "").toLowerCase().replace(/[.,!?]/g,"").trim();
        var exp = expected.toLowerCase().replace(/[.,!?]/g,"").trim();
        finish(said.indexOf(exp) !== -1 || exp.indexOf(said) !== -1);
      };
      rec.onerror = function(){ finished = true; finish(null); };
      rec.onend = function(){ if(!finished) finish(null); };
      rec.start();
    }catch(err){
      finish(null);
    }

    setTimeout(function(){ if(recorder && recorder.state !== "inactive") recorder.stop(); }, 4000);
  }

  function renderMemGrid(){
    var grid = document.getElementById("memgrid");
    grid.innerHTML = "";
    memState.cards.forEach(function(c, idx){
      var isOpen = memState.open.indexOf(idx) !== -1 || memState.matched.indexOf(idx) !== -1;
      var isMatched = memState.matched.indexOf(idx) !== -1;
      var d = document.createElement("button");
      d.className = "mcard" + (isOpen ? " flipped" : "") + (isMatched ? " matched" : "");
      d.innerHTML = '<span class="face">'+c.face+'</span><span class="back">?</span>';
      d.setAttribute("aria-label", isOpen ? c.face : "Carte face cachée");

      grid.appendChild(d);
    });
    document.getElementById("movesN").textContent = memState.moves;
    document.getElementById("matchN").textContent = memState.matched.length/2;
  }

  function flip(idx){
    if(memState.open.indexOf(idx) !== -1 || memState.matched.indexOf(idx) !== -1) return;
    if(memState.open.length === 2) return;
    memState.open.push(idx);
    renderMemGrid();
    if(memState.open.length === 2){
      memState.moves++;
      var a = memState.cards[memState.open[0]], b = memState.cards[memState.open[1]];
      if(a.pairId === b.pairId){
        memState.matched.push(memState.open[0], memState.open[1]);

        memState.open = [];

        nextBtn.disabled = memState.matched.length < memState.cards.length/2;

        setTimeout(function(){

          renderMemGrid();
        }, 700);
      }
    }
  }

      document.getElementById("qAudioBtn").addEventListener("click", function(){ speak(Q.audio); });
    }
    nextBtn.style.display = "none";
    backBtn.style.visibility = "hidden";
    hint.textContent = "Bonne réponse : ça avance tout seul. Sinon, une 2e chance t'est donnée.";
    var opts = document.getElementById("opts");
    var attempts = 0;
    var resolved = false;
    Q.opts.forEach(function(opt, i){
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = opt;
      b.addEventListener("click", function(){
        if(resolved || b.disabled) return;
        if(looksEnglish(opt)) speak(opt);
        attempts++;
        var isCorrect = i === Q.correct;
        if(isCorrect){
          markOption(b, "correct");
          Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
          resolved = true;
          if(state.quizLog[qi] === undefined){
            var firstTry = attempts === 1;
            state.quizLog[qi] = firstTry;
            if(firstTry) state.quizScore++;
          }
          pendingAutoAdvance = setTimeout(goNext, 650);
        } else if(attempts >= 2){
          markOption(b, "incorrect");
          markOption(opts.children[Q.correct], "correct");
          Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
          resolved = true;
          if(state.quizLog[qi] === undefined) state.quizLog[qi] = false;
          document.getElementById("qWhyWrap").innerHTML =
            '<div class="why-inline"><span class="icon">💡</span><div>'+Q.why+'</div></div>' +
            '<button class="btn btn-primary" id="qContinue" style="margin-top:12px">'+(qi===QUIZ.length-1?"Voir mon bilan":"Suivant")+'</button>';
          document.getElementById("qContinue").addEventListener("click", goNext);
        } else {
          markOption(b, "incorrect");
          b.disabled = true;
        }
      });
      opts.appendChild(b);
    });
  }

  // ---------- Screen 4 : Bilan ----------
  function screenBilan(){
    var hasNext = state.lesson < TOTAL_LESSONS - 1;
    var passThreshold = Math.ceil(QUIZ.length * PASS_THRESHOLD_RATIO);
    var passed = state.quizScore >= passThreshold;
    postmark.innerHTML = state.lesson === -1 ? "BILAN<br>FOND." : "BILAN<br>JOUR&nbsp;" + String(state.lesson+1).padStart(2,"0");
    var recap = QUIZ.map(function(q, i){
      var hit = state.quizLog[i];
      return '<div class="recap-item '+(hit?"hit":"miss")+'"><span class="tick">'+(hit?"✓":"✕")+'</span><span>'+q.q+'</span></div>';
    }).join("");
    var nextStepHtml = passed
      ? '<p class="lede" style="margin-top:14px"><b>Prochaine étape —</b> '+NEXT_PREVIEW+'</p>'
      : '<div class="bilan-retry"><b>Palier pas encore acquis</b> — il faut au moins '+passThreshold+'/'+QUIZ.length+' pour débloquer la suite (60%). Revois la leçon pour consolider les notions fragiles avant de continuer.</div>';
    screen.innerHTML =
      '<div class="eyebrow">Bilan de session</div>' +
      '<h2 class="screen-title">'+(passed ? META.bilanTitle : "Cette leçon a besoin d\'être consolidée.")+'</h2>' +
      '<div class="score-band"><span class="big">'+state.quizScore+'</span><span class="of">/ '+QUIZ.length+' au contrôle</span></div>' +
      '<div class="stat-grid">' +
        '<div class="stat"><div class="n">'+VOCAB.length+'</div><div class="l">Mots vus</div></div>' +
        '<div class="stat"><div class="n">'+memState.moves+'</div><div class="l">Coups au jeu</div></div>' +
        '<div class="stat"><div class="n">'+(state.lesson === -1 ? "F" : "J"+(state.lesson+1))+'</div><div class="l">Série</div></div>' +
      '</div>' +
      '<div class="recap">'+recap+'</div>' +
      nextStepHtml;
    nextBtn.textContent = passed
      ? (hasNext ? "Passer à la leçon " + (state.lesson+2) : "Passer au grand contrôle A1")
      : "Revoir la leçon";
    backBtn.style.visibility = "hidden";
    hint.textContent = passed ? "" : "Reprends la leçon depuis le début pour retravailler les points fragiles.";
  }

  // ---------- Écrans du Grand Contrôle de fin de niveau A1 ----------
  function screenGCAccueil(){
    backBtn.style.visibility = "hidden";
    screen.innerHTML =
      '<div class="eyebrow">Grand Contrôle · fin de niveau A1</div>' +
      '<h2 class="screen-title">Tu as terminé les 12 paliers — prêt·e pour le grand contrôle ?</h2>' +
      '<p class="lede">Il reprend tout ce que tu as travaillé depuis la Leçon 1 : d\'abord '+GC_ROUNDS.length+' manches de construction de phrase (expression, /15), puis '+GC_QUIZ.length+' questions QCM mêlant écoute, lecture et grammaire/vocabulaire (/25). Résultat final sur 40, présenté aussi sur 20.</p>' +
      '<p class="lede">Bonne réponse au 1er essai à chaque manche/question : ça compte. Une 2e chance t\'est donnée en cas d\'erreur, mais seul le 1er essai rapporte des points.</p>';
    nextBtn.style.display = "";
    nextBtn.textContent = "Commencer le grand contrôle";
    hint.textContent = "";
  }

  function screenGCBilan(){
    var gcTotal = state.quizScore + state.gcExprScore;
    var gcMax = GC_QUIZ.length + GC_ROUNDS.length; // /40
    var gcOn20 = Math.round(gcTotal / gcMax * 20);
    var passThreshold = Math.ceil(gcMax * PASS_THRESHOLD_RATIO);
    var passed = gcTotal >= passThreshold;
    postmark.innerHTML = "BILAN<br>NIV. A1";
    var recap = GC_QUIZ.map(function(q, i){
      var hit = state.quizLog[i];
      return '<div class="recap-item '+(hit?"hit":"miss")+'"><span class="tick">'+(hit?"✓":"✕")+'</span><span>'+q.q+'</span></div>';
    }).join("");
    var exprRecap = '<div class="recap-item '+(state.gcExprScore===GC_ROUNDS.length?"hit":"miss")+'">' +
      '<span class="tick">'+(state.gcExprScore===GC_ROUNDS.length?"✓":"…")+'</span>' +
      '<span>Expression (construction de phrase) : '+state.gcExprScore+' / '+GC_ROUNDS.length+' manches réussies du 1er coup</span></div>';
    var nextStepHtml = passed
      ? '<p class="lede" style="margin-top:14px"><b>Niveau A1 validé !</b> Le niveau A2 n\'existe pas encore dans l\'appli — en attendant, tu peux repasser sur tes leçons pour continuer à consolider.</p>'
      : '<div class="bilan-retry"><b>Niveau A1 pas encore validé</b> — il faut au moins '+passThreshold+'/'+gcMax+' pour valider (60%). Reprends tes leçons pour consolider les notions fragiles, puis retente le grand contrôle.</div>';
    screen.innerHTML =
      '<div class="eyebrow">Bilan du Grand Contrôle</div>' +
      '<h2 class="screen-title">'+(passed ? "Bravo, le niveau A1 est validé !" : "Le niveau A1 a besoin d\'être consolidé.")+'</h2>' +
      '<div class="score-band"><span class="big">'+gcTotal+'</span><span class="of">/ '+gcMax+' (soit '+gcOn20+'/20)</span></div>' +
      '<div class="stat-grid">' +
        '<div class="stat"><div class="n">'+state.quizScore+'</div><div class="l">Compréhension + gram./vocab (/'+GC_QUIZ.length+')</div></div>' +
        '<div class="stat"><div class="n">'+state.gcExprScore+'</div><div class="l">Expression (/'+GC_ROUNDS.length+')</div></div>' +
        '<div class="stat"><div class="n">A1</div><div class="l">Niveau évalué</div></div>' +
      '</div>' +
      nextStepHtml +
      '<details class="gc-recap-toggle"><summary>Voir le détail des '+(GC_QUIZ.length+1)+' réponses</summary>' +
        '<div class="recap">'+exprRecap+recap+'</div>' +
      '</details>';
    nextBtn.textContent = passed ? "Revoir mes leçons" : "Recommencer le grand contrôle";
    backBtn.style.visibility = "hidden";
    hint.textContent = "";
  }

  function render(){
    loadLessonData();
    try { localStorage.setItem(LESSON_KEY, String(state.lesson)); } catch(e){}
    if(state.variant){ document.documentElement.setAttribute("data-flag", state.variant); }
    else { document.documentElement.removeAttribute("data-flag"); }
    updateRouteChip();
    nextBtn.style.display = "";
    nextBtn.disabled = false;
    if(state.lesson === GRAND_CONTROLE_LESSON){
      itinerary.hidden = true;
      postmark.innerHTML = "GRAND<br>CONTRÔLE";
      if(state.step === 0) screenGCAccueil();
      else if(state.step === 1) renderSentenceBuilder();
      else if(state.step === 2) screenControle();
      else screenGCBilan();
      return;
    }
    itinerary.hidden = state.step === 0;
    renderItinerary();
    if(state.step === 0) screenAccueil();
    else if(state.step === 1) screenLecon();
    else if(state.step === 2) screenPrononciation();
    else if(state.step === 3) screenJeu();
    else if(state.step === 4) screenLecture();
    else if(state.step === 5) screenControle();
    else screenBilan();
  }

  var pendingAutoAdvance = null;
  function goNext(){
    if(pendingAutoAdvance){ clearTimeout(pendingAutoAdvance); pendingAutoAdvance = null; }
    if(state.lesson === GRAND_CONTROLE_LESSON){
      if(state.step === 0){
        state.step = 1; sbRound = 0;
      } else if(state.step === 1 && sbRound < ROUNDS.length-1){
        sbRound++;
      } else if(state.step === 1){
        state.step = 2; state.quizIndex = 0; sbRound = 0;
      } else if(state.step === 2 && state.quizIndex < QUIZ.length-1){
        state.quizIndex++;
      } else if(state.step === 2){
        state.step = 3;
      } else if(state.step === 3){
        var gcTotal = state.quizScore + state.gcExprScore;
        var gcMax = GC_QUIZ.length + GC_ROUNDS.length;
        var gcPassed = gcTotal >= Math.ceil(gcMax * PASS_THRESHOLD_RATIO);
        state.quizIndex = 0; state.quizScore = 0; state.quizLog = [];
        state.gcExprScore = 0; state.gcExprLog = []; sbRound = 0;
        if(gcPassed){
          // A1 validé : pas encore de niveau A2 dans l'appli — retour à la Leçon 1 pour réviser.
          state.lesson = 0; state.step = 0; state.reviewDone = true; state.reviewLog = [];
        } else {
          // A1 pas encore validé : on relance un nouveau passage du Grand Contrôle.
          state.step = 0;
        }
      }
      render();
      return;
    }
    if(state.step === 1 && state.subStep === 4 && sbRound < ROUNDS.length-1){
      sbRound++;
      render();
      return;
    }
    if(state.step === 1 && state.subStep === 0 && vocabBlockIdx < vocabBlocks().length-1){
      vocabBlockIdx++;
      render();
      return;
    }
    if(state.step === 1 && state.subStep < LECON_SUBSTEPS-1){
      state.subStep++;
      if(state.subStep === 1){ vocabBlockIdx = 0; }
    } else if(state.step === 4 && state.subStep < LECTURE_SUBSTEPS-1){
      state.subStep++;
    } else if(state.step === 5 && state.quizIndex < QUIZ.length-1){
      state.quizIndex++;
    } else if(state.step === 6){
      var bilanPassed = state.quizScore >= Math.ceil(QUIZ.length * PASS_THRESHOLD_RATIO);
      if(bilanPassed && state.lesson < GRAND_CONTROLE_LESSON){
        state.lesson++;
        state.reviewDone = false; state.reviewLog = [];
        if(state.lesson === GRAND_CONTROLE_LESSON){ state.gcExprScore = 0; state.gcExprLog = []; }
      }
      state.step = 0; state.subStep = 0; state.quizIndex = 0; state.quizScore = 0; state.quizLog = [];
      memState = null; sbRound = 0; vocabBlockIdx = 0;
    } else {
      state.step = Math.min(state.step+1, 6);
      state.subStep = 0;
    }
    render();
  }
  nextBtn.addEventListener("click", goNext);

  backBtn.addEventListener("click", function(){
    if(state.lesson === GRAND_CONTROLE_LESSON){
      if(state.step === 1 && sbRound > 0){ sbRound--; render(); return; }
      if(state.step === 1 && sbRound === 0){ state.step = 0; render(); return; }
      return; // pas de retour arrière pendant le Contrôle ou depuis le Bilan (comme pour les leçons)
    }
    if(state.step === 1 && state.subStep === 4 && sbRound > 0){
      sbRound--;
      render();
      return;
    }
    if(state.step === 1 && state.subStep === 0 && vocabBlockIdx > 0){
      vocabBlockIdx--;
      render();
      return;
    }
    if(state.step === 1 && state.subStep > 0){
      state.subStep--;
      if(state.subStep === 0){ vocabBlockIdx = vocabBlocks().length-1; }
    } else if(state.step === 4 && state.subStep > 0){
      state.subStep--;
    } else {
      state.step = Math.max(state.step-1, 0);
      state.subStep = 0;
      vocabBlockIdx = 0;
    }
    render();
  });

  render();

})();
</script>
</body>
</html>
