<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Roots — Leçon</title>
<link rel="icon" type="image/png" href="assets/img/app-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F6F7F9;
    --ink:#1B1D22;
    --muted:#5B6068;
    --accent:#E2A13D;
    --accent-ink:#FFFFFF;
    --accent-soft:#FBEBD3;
    --pop:#E0432F;
    --pop-soft:#FBD3CE;
    --good:#1E8E4F;
    --good-soft:#CFEED9;
    --gold:#1B3C39;
    --gold-soft:#E8EEED;
    --line:#E6E8EC;
    --shadow: 0 1px 2px rgba(22,35,44,.06), 0 8px 24px -12px rgba(22,35,44,.18);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E171D; --surface:#16222A; --surface-2:#1D2C35; --ink:#E7EEF1; --muted:#93A8B2;
      --accent:#77AAD3; --accent-ink:#0E171D; --accent-soft:#1F3542; --pop:#FF8368; --pop-soft:#4A2620;
      --good:#5FD68C; --good-soft:#1D3A28;
      --gold:#E4BE6A; --gold-soft:#3A301A; --line:#2A3942;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E171D; --surface:#16222A; --surface-2:#1D2C35; --ink:#E7EEF1; --muted:#93A8B2;
    --accent:#77AAD3; --accent-ink:#0E171D; --accent-soft:#1F3542; --pop:#FF8368; --pop-soft:#4A2620;
    --good:#5FD68C; --good-soft:#1D3A28;
    --gold:#E4BE6A; --gold-soft:#3A301A; --line:#2A3942;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }

  /* Note : contrairement au prototype d'origine, l'identité visuelle "The
     Roots" (couleurs, fond) reste la même quelle que soit la variante
     (britannique/américaine) choisie — pas de re-thème par drapeau, pour
     rester cohérent avec le reste de l'application. */

  *{box-sizing:border-box;}
  /* Même fond que le reste de l'application (globe/drapeaux en haut,
     villes en bas), fixe derrière tout, jamais coupé : une copie floutée
     comble les bords, une copie nette et entière reste centrée dessus. */
  body::before, body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background-image:url('assets/img/shell-bg.jpg');
    background-repeat:no-repeat; background-position:center;
  }
  body::before{
    background-size:cover;
    filter:blur(46px) saturate(1.15) brightness(0.97);
    transform:scale(1.18);
  }
  body::after{ background-size:contain; }
  html{ background:var(--bg); }
  body{
    margin:0;
    background:transparent;
    color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, sans-serif;
    padding-inline:16px;
    padding-block:32px;
    min-height:100vh;
    position:relative;
    isolation:isolate;
  }
  h1,h2,h3{ font-family:"Sora", ui-sans-serif, sans-serif; text-wrap:balance; margin:0; line-height:1.15; font-weight:700; }
  .wrap{ max-width:640px; margin-inline:auto; display:flex; flex-direction:column; gap:18px; }

  .masthead{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{ font-family:"Sora", sans-serif; font-weight:800; font-size:1.5rem; letter-spacing:-0.01em; }
  .brand .tagline{ font-weight:600; font-size:.68rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .route-chip{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 14px 6px 8px; box-shadow:var(--shadow); font-weight:600; font-size:.78rem; letter-spacing:.01em; color:var(--muted); }
  .route-chip .flags{ font-size:1rem; line-height:1; }
  .route-chip b{ color:var(--ink); font-weight:600; }

  .itinerary{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .itinerary[hidden]{ display:none; }
  .leg{ display:flex; flex-direction:column; gap:6px; align-items:center; }
  .leg .dot{ width:100%; height:5px; border-radius:3px; background:var(--line); }
  .leg.done .dot{ background:var(--accent); }
  .leg.active .dot{ background:var(--pop); }
  .leg .label{ font-weight:600; font-size:.62rem; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); text-align:center; }
  .leg.active .label{ color:var(--pop); font-weight:600; }
  .leg.done .label{ color:var(--accent); }

  /* Encadré transparent (verre dépoli), pour rester cohérent avec le
     reste de l'application : plus de pavé blanc plein derrière la leçon,
     le décor se devine flouté derrière, le texte garde un léger halo pour
     rester lisible. */
  .card{
    position:relative;
    background: rgba(255,255,255,0.40);
    backdrop-filter: blur(12px) saturate(1.15);
    -webkit-backdrop-filter: blur(12px) saturate(1.15);
    border: 1px solid rgba(255,255,255,0.55);
    border-radius:var(--radius);
    box-shadow: 0 8px 20px rgba(20,20,30,0.07), 0 1px 0 rgba(255,255,255,0.6) inset;
    padding:28px 24px 24px;
    overflow:hidden;
    color: var(--ink);
    text-shadow: 0 1px 2px rgba(255,255,255,.4);
  }
  .postmark{ position:absolute; top:16px; right:16px; width:52px; height:52px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.56rem; color:var(--muted); text-align:center; line-height:1.15; transform:rotate(-8deg); flex-direction:column; opacity:.8; }
  .eyebrow{ font-weight:700; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  .screen-title{ font-size:1.55rem; max-width:80%; }
  .lede{ color:var(--muted); margin-top:8px; font-size:.91rem; max-width:52ch; }
  .step-count{ font-weight:600; font-size:.68rem; color:var(--muted); margin-top:2px; }

  .vocab-list{ display:flex; flex-direction:column; gap:8px; }
  .vocab-block-title{ font-family:"Sora", sans-serif; font-weight:700; font-size:.78rem; letter-spacing:.03em; text-transform:uppercase; color:var(--accent); margin:14px 0 2px; }
  .vocab-block-title:first-child{ margin-top:0; }
  .vocab-block-heading{ font-family:"Sora", sans-serif; font-weight:700; font-size:.82rem; letter-spacing:.03em; text-transform:uppercase; color:var(--accent); margin-top:10px; }
  .vocab-dots{ display:flex; gap:6px; margin-top:8px; }
  .vocab-dot{ width:7px; height:7px; border-radius:50%; background:var(--line); }
  .vocab-dot.active{ background:var(--accent); width:18px; border-radius:4px; }
  .vocab-row{ background:var(--surface-2); border-radius:12px; padding:10px 12px; }
  .vocab-main{ display:flex; align-items:center; gap:10px; }
  .vocab-row .say{ flex:0 0 auto; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--accent); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s ease, background .12s ease; }
  .vocab-row .say:hover{ background:var(--accent-soft); }
  .vocab-row .say:active{ transform:scale(.92); }
  .vocab-row .words{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  .vocab-row .en{ font-weight:700; font-size:1rem; }
  .vocab-row .ipa{ font-family:"IBM Plex Mono", monospace; font-size:.7rem; color:var(--muted); }
  .vocab-row .fr{ font-weight:600; font-size:.82rem; color:var(--accent); flex:0 0 auto; }
  .note-toggle{ flex:0 0 auto; background:none; border:none; color:var(--gold); font-size:.95rem; cursor:pointer; padding:4px; }
  .note-panel{ font-size:.82rem; color:var(--ink); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .note-panel b{ color:var(--gold); }

  .culture-note-card{ margin-top:16px; background:var(--accent-soft); border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius:14px; padding:13px 15px; }
  .culture-note-head{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:.86rem; color:var(--accent); }
  .culture-note-icon{ font-size:1.05rem; }
  .culture-note-text{ font-size:.83rem; color:var(--ink); margin-top:7px; line-height:1.5; }
  .culture-note-text b{ color:var(--accent); }

  .why{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .why-toggle{ align-self:flex-start; display:flex; align-items:center; gap:6px; background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); color:var(--gold); font-family:"Manrope", sans-serif; font-weight:600; font-size:.82rem; border-radius:999px; padding:7px 14px; cursor:pointer; }
  .why-toggle .chev{ transition:transform .15s ease; font-size:.7rem; }
  .why-toggle[aria-expanded="true"] .chev{ transform:rotate(180deg); }
  .why-panel{ background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); border-radius:12px; padding:11px 14px; font-size:.86rem; }
  .why-panel b{ color:var(--gold); }
  .why-inline{ display:flex; gap:9px; background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); border-radius:12px; padding:11px 14px; margin-top:12px; font-size:.85rem; }
  .why-inline .icon{ flex:0 0 auto; }

  .bank{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; min-height:44px; }
  .chip-btn{ font-family:"Manrope", sans-serif; font-weight:700; font-size:.92rem; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:8px 14px; cursor:pointer; }
  .chip-btn:hover{ border-color:var(--accent); }
  .chip-btn:disabled{ opacity:.35; cursor:default; }
  .answer-row{ display:flex; flex-wrap:wrap; gap:8px; min-height:46px; border:1px dashed var(--line); border-radius:10px; padding:8px; margin-top:10px; }
  .answer-row .chip-btn{ background:var(--accent-soft); border-color:var(--accent); }
  .round-tag{ font-weight:700; font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }

  .conj-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .conj-item{ background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:.86rem; color:var(--muted); }
  .conj-item b{ font-family:"Sora", sans-serif; font-weight:700; font-size:.94rem; display:block; color:var(--ink); margin-bottom:2px; }
  .conj-item .ctr{ color:var(--accent); }
  @media (max-width:480px){ .conj-grid{ grid-template-columns:1fr; } }

  .dialogue{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .bubble-row{ display:flex; gap:8px; align-items:flex-end; }
  .bubble-row.you{ flex-direction:row-reverse; }
  .avatar{ width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:.82rem; font-weight:700; flex:0 0 auto; }
  .bubble-row.you .avatar{ background:var(--gold-soft); color:var(--gold); }
  .bubble{ max-width:78%; padding:9px 13px; border-radius:16px; background:var(--surface-2); border-bottom-left-radius:4px; }
  .bubble-row.you .bubble{ background:var(--accent-soft); border-bottom-left-radius:16px; border-bottom-right-radius:4px; }
  .bubble .en{ font-weight:700; font-size:.92rem; display:block; }
  .bubble .fr{ font-size:.74rem; color:var(--muted); display:block; margin-top:3px; }

  .mini-check{ background:var(--surface-2); border-radius:12px; padding:14px; margin-top:12px; }
  .mini-q{ font-weight:700; font-size:.94rem; margin-bottom:8px; }
  .mini-opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .mini-opt{ font-family:"Manrope", sans-serif; font-weight:600; font-size:.86rem; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px 12px; cursor:pointer; }
  .mini-opt.correct{ background:var(--good-soft); border:2px solid var(--good); color:var(--ink); font-weight:700; }
  .mini-opt.incorrect{ background:var(--pop-soft); border:2px solid var(--pop); color:var(--ink); text-decoration:line-through; text-decoration-color:var(--pop); }
  .mini-opt .opt-icon{ font-weight:800; }
  .mini-opt.correct .opt-icon{ color:var(--good); }
  .mini-opt.incorrect .opt-icon{ color:var(--pop); }
  .mini-opt:disabled{ cursor:default; }
  .mini-fb{ font-size:.78rem; color:var(--muted); margin-top:6px; }

  .memgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .mcard{ aspect-ratio:1/.82; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); display:flex; align-items:center; justify-content:center; text-align:center; padding:6px; font-size:.84rem; font-weight:700; cursor:pointer; user-select:none; transition:background .15s ease, border-color .15s ease, transform .1s ease; }
  .mcard .face{ display:none; }
  .mcard.flipped .face{ display:block; }
  .mcard.flipped .back{ display:none; }
  .mcard .back{ font-family:"Sora", sans-serif; font-size:1.3rem; color:var(--muted); }
  .mcard.matched{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); cursor:default; }
  .mcard:active{ transform:scale(.97); }
  .game-stats{ display:flex; gap:16px; margin-top:12px; font-family:"IBM Plex Mono", monospace; font-size:.78rem; color:var(--muted); }
  .game-stats b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  .q-progress{ font-family:"IBM Plex Mono", monospace; font-size:.72rem; color:var(--muted); letter-spacing:.04em; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .q-cat{ display:inline-flex; align-items:center; gap:4px; font-family:"Manrope",sans-serif; font-weight:700; font-size:.66rem; letter-spacing:.04em; text-transform:uppercase; padding:3px 10px; border-radius:999px; }
  .q-cat.oral{ background:var(--accent-soft); color:var(--accent); }
  .q-cat.ecrit{ background:var(--gold-soft); color:var(--gold); }
  .q-cat.comprehension{ background:var(--pop-soft); color:var(--pop); }
  .q-audio{ display:flex; align-items:center; gap:10px; margin-top:10px; background:var(--surface-2); border-radius:12px; padding:10px 12px; }
  .q-audio-btn{ flex:0 0 auto; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--accent); font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .q-audio-btn:hover{ background:var(--accent-soft); }
  .q-audio-hint{ font-size:.8rem; color:var(--muted); font-weight:600; }
  .q-passage{ background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 12px 12px 0; padding:12px 14px; margin-top:8px; font-size:.92rem; line-height:1.5; }
  .gloss-box{ background:var(--gold-soft); border-radius:12px; padding:10px 12px; margin:10px 0 14px; }
  .gloss-title{ font-weight:700; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); margin-bottom:6px; }
  .gloss-item{ font-size:.86rem; margin-top:3px; }
  .gloss-item b{ color:var(--ink); }
  .newword{ color:var(--pop); font-weight:700; text-decoration:underline; text-decoration-color:var(--pop-soft); text-underline-offset:3px; }
  .gloss-word{ border-bottom:2px dotted var(--accent); cursor:pointer; position:relative; }
  .gloss-word.active{ background:var(--accent-soft); border-radius:3px; }
  .gloss-word.active::after{
    content:attr(data-fr);
    position:absolute; left:50%; bottom:100%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:.72rem; font-weight:700;
    padding:5px 9px; border-radius:7px; white-space:nowrap; margin-bottom:6px;
    box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:5;
  }
  .q-text{ font-size:1.1rem; font-weight:700; margin-top:6px; }
  .options{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .opt{ text-align:left; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 14px; font-size:.94rem; font-family:inherit; color:var(--ink); cursor:pointer; }
  .opt:hover{ border-color:var(--accent); }
  .opt.correct{ background:var(--good-soft); border:2px solid var(--good); color:var(--ink); font-weight:700; }
  .opt.incorrect{ background:var(--pop-soft); border:2px solid var(--pop); color:var(--ink); text-decoration:line-through; text-decoration-color:var(--pop); }
  .opt .opt-icon{ font-weight:800; }
  .opt.correct .opt-icon{ color:var(--good); }
  .opt.incorrect .opt-icon{ color:var(--pop); }
  .opt:disabled{ cursor:default; }

  .score-band{ display:flex; align-items:baseline; gap:10px; margin:10px 0 4px; }
  .score-band .big{ font-family:"Sora", sans-serif; font-weight:800; font-size:3rem; color:var(--accent); font-variant-numeric:tabular-nums; }
  .score-band .of{ font-family:"IBM Plex Mono", monospace; color:var(--muted); font-size:1rem; }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  .stat{ background:var(--surface-2); border-radius:12px; padding:12px; text-align:center; }
  .stat .n{ font-family:"IBM Plex Mono", monospace; font-weight:600; font-size:1.15rem; font-variant-numeric:tabular-nums; }
  .stat .l{ font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .recap{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  .recap-item{ display:flex; gap:10px; font-size:.86rem; align-items:flex-start; }
  .recap-item .tick{ flex:0 0 auto; }
  .recap-item.miss .tick{ color:var(--pop); font-weight:800; }
  .recap-item.hit .tick{ color:var(--good); font-weight:800; }
  .bilan-retry{ margin-top:16px; padding:12px 14px; background:var(--pop-soft); border:2px solid var(--pop); border-radius:12px; font-size:.86rem; line-height:1.4; }
  .gc-recap-toggle{ margin-top:16px; }
  .gc-recap-toggle summary{ cursor:pointer; color:var(--accent); font-weight:700; font-size:.86rem; list-style:none; padding:4px 0; }
  .gc-recap-toggle summary::-webkit-details-marker{ display:none; }
  .gc-recap-toggle summary::before{ content:"▸ "; }
  .gc-recap-toggle[open] summary::before{ content:"▾ "; }
  .gc-recap-toggle .recap{ margin-top:12px; }

  .controls{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .btn{ font-family:"Manrope", sans-serif; font-weight:700; font-size:.96rem; border-radius:12px; padding:12px 22px; border:1px solid transparent; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); margin-left:auto; }
  .btn-primary:disabled{ opacity:.4; cursor:default; }
  .btn-ghost{ background:transparent; color:var(--muted); border-color:var(--line); }
  .btn:focus-visible, .chip-btn:focus-visible, .opt:focus-visible, .mcard:focus-visible, .say:focus-visible, .why-toggle:focus-visible, .mini-opt:focus-visible, .note-toggle:focus-visible{ outline:2px solid var(--pop); outline-offset:2px; }
  .hint{ font-weight:600; font-size:.72rem; color:var(--muted); text-align:center; }

  .variant-pick{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .variant-btn{ display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer; text-align:left; font-family:"Manrope", sans-serif; }
  .variant-btn:hover{ border-color:var(--accent); }
  .variant-btn .vflag{ font-size:1.6rem; }
  .variant-btn .vtext b{ display:block; font-family:"Sora", sans-serif; font-size:1rem; color:var(--ink); }
  .variant-btn .vtext span{ font-size:.78rem; color:var(--muted); }
  .variant-switch{ margin-top:10px; background:none; border:none; color:var(--accent); font-weight:600; font-size:.8rem; cursor:pointer; padding:0; }

  .pron-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .pron-row{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:12px; padding:10px 12px; }
  .pron-row .txt{ flex:1; min-width:0; }
  .pron-row .en{ font-weight:700; font-size:.94rem; }
  .pron-row .fr{ display:block; font-size:.76rem; color:var(--accent); font-weight:600; margin-top:2px; }
  .reading-block{ background:var(--surface-2); border-radius:14px; padding:16px 18px; margin:6px 0 14px; font-size:.98rem; line-height:1.85; }
  .reading-block .sent{ cursor:pointer; border-radius:4px; padding:0 2px; }
  .reading-block .sent:hover{ background:var(--accent-soft); }
  .reading-block .sent:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .mic-btn{ flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; width:38px; height:38px; font-size:1rem; cursor:pointer; color:var(--ink); }

    ids.forEach(function(id){ (quizOf(id) || []).forEach(function(q){ pool.push(Object.assign({}, q, { _lesson:id })); }); });
    if(level !== "A2"){ buildGrandControle(); GC_QUIZ.forEach(function(q){ pool.push(Object.assign({}, q, { _lesson:lessonFromWhy(q, null) })); }); }
    if(level !== "A1"){ buildGrandControleA2(); GC_QUIZ_A2.forEach(function(q){ pool.push(Object.assign({}, q, { _lesson:lessonFromWhy(q, null) })); }); }
    var seen = {}, byCat = { oral:[], comprehension:[], ecrit:[] };
    pool.forEach(function(q){ var k = qKey(q); if(seen[k]) return; seen[k] = 1; (byCat[q.cat] || byCat.ecrit).push(q); });
    var target = { oral:8, comprehension:7, ecrit:10 }, quiz = [], left = [];
    Object.keys(target).forEach(function(c){ var sh = shuffleArr(byCat[c]); quiz = quiz.concat(sh.slice(0, target[c])); left = left.concat(sh.slice(target[c])); });
    if(quiz.length < 25) quiz = quiz.concat(shuffleArr(left).slice(0, 25 - quiz.length));
    var rpool = [], rseen = {};
    ids.forEach(function(id){ (roundsOf(id) || []).forEach(function(r){ rpool.push(Object.assign({}, r, { _lesson:id })); }); });
    if(level !== "A2") (GC_ROUNDS || []).forEach(function(r){ rpool.push(Object.assign({}, r, { _lesson:null })); });
    if(level !== "A1") (GC_ROUNDS_A2 || []).forEach(function(r){ rpool.push(Object.assign({}, r, { _lesson:null })); });
    rpool = rpool.filter(function(r){ if(!r || !r.bank || !r.answer || rseen[r.answer]) return false; rseen[r.answer] = 1; return true; });
    state.ctrlDraw = { level:level, quiz:shuffleArr(quiz), rounds:shuffleArr(rpool).slice(0, 15), saved:false };
    return state.ctrlDraw;
  }

  // ---------- Compétences (jauges) ----------
  var SKILL_LABEL = { co:"Compréhension orale", ce:"Compréhension écrite", ee:"Expression écrite", eo:"Expression orale", gr:"Grammaire", vo:"Vocabulaire", pr:"Prononciation", gv:"Grammaire et vocabulaire" };
  function skillOfQ(q){
    if(q.cat === "oral") return "co";
    if(q.cat === "comprehension") return "ce";
    var t = (q.q || "") + " " + (q.why || "");
    return /(veut dire|signifie|traduction|traduis|quel mot|vocabulaire|synonyme|contraire|désigne|comment dit-on|comment dire)/i.test(t) ? "vo" : "gr";
  }
  function recordSkill(skill, ok){
    var all = lsGet(K_SKILLS, {}), m = all[LANG] || {}, s = m[skill] || { ok:0, total:0 };
    s.ok += ok ? 1 : 0; s.total += 1;
    if(s.total > 80){ s.ok *= 0.8; s.total *= 0.8; } // les résultats récents comptent plus
    s.at = Date.now(); m[skill] = s; all[LANG] = m; lsSet(K_SKILLS, all);
  }
  function recordError(lessonId){
    if(lessonId == null || lessonId === GRAND_CONTROLE_LESSON || lessonId > 24) return;
    var all = lsGet(K_ERR, {}), m = all[LANG] || {}, e = m[lessonId] || { count:0, stage:0, due:0 };
    e.count += 1; e.stage = 0; e.due = Date.now(); e.at = Date.now();
    m[lessonId] = e; all[LANG] = m; lsSet(K_ERR, all);
  }
  function recordPass(lessonId){
    var all = lsGet(K_PASS, {}), m = all[LANG] || {};
    m[lessonId] = Date.now(); all[LANG] = m; lsSet(K_PASS, all);
  }
  function onQuizAnswered(Q, ok){
    recordSkill(skillOfQ(Q), ok);
    if(!ok) recordError(Q._lesson != null ? Q._lesson : state.lesson);
  }
  function gaugeHtml(label, pct){
    var col = pct == null ? "#9aa5a3" : (pct >= 70 ? "#2e8a57" : (pct >= 50 ? "#b8741a" : "#c2412f"));
    return '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:.86rem;font-weight:700"><span>'+label+'</span><span style="color:'+col+'">'+(pct == null ? "—" : pct+" %")+'</span></div>' +
      '<div style="height:9px;border-radius:6px;background:rgba(27,60,57,.1);overflow:hidden;margin-top:4px"><div style="width:'+(pct || 0)+'%;height:100%;background:'+col+';border-radius:6px"></div></div></div>';
  }
  // Jauges du contrôle d'une leçon (fin de chaque leçon, demande d'Ashley).
  function lessonGaugesHtml(){
    var sk = {};
    QUIZ.forEach(function(q, i){ var k = skillOfQ(q); sk[k] = sk[k] || [0,0]; sk[k][1]++; if(state.quizLog[i]) sk[k][0]++; });
    var order = ["co","ce","gr","vo"];
    return '<div class="card" style="margin-top:14px;padding:14px 16px"><div class="eyebrow" style="margin-bottom:4px">Tes jauges sur cette leçon</div>' +
      order.filter(function(k){ return sk[k]; }).map(function(k){ return gaugeHtml(SKILL_LABEL[k], Math.round(sk[k][0] / sk[k][1] * 100)); }).join("") + '</div>';
  }

  // ---------- Renforts & rappels ----------
  function getBoosts(){ return (lsGet(K_BOOST, {})[LANG]) || {}; }
  function setBoost(level, data){ var all = lsGet(K_BOOST, {}), m = all[LANG] || {}; m[level] = data; all[LANG] = m; lsSet(K_BOOST, all); }
  var rappelCache = {};
  function withRappels(quiz){
    var lvl = (state.lesson >= 13 && state.lesson <= 24) ? "A2" : null;
    var b = lvl && getBoosts()[lvl];
    if(!b || !b.rappel || !b.rappel.length) return quiz;
    var key = state.lesson + ":" + b.rappel.join(",");
    if(!rappelCache[key]){
      var pool = [];
      b.rappel.forEach(function(id){ (quizOf(id) || []).forEach(function(q){ pool.push(Object.assign({}, q, { _lesson:id, q:"🔁 Rappel · " + q.q })); }); });
      rappelCache[key] = shuffleArr(pool).slice(0, 2);
    }
    return quiz.concat(rappelCache[key]);
  }
  function pendingRenforts(level){
    var b = getBoosts()[level];
    if(!b || !b.renfort) return [];
    var done = b.done || [];
    return b.renfort.filter(function(id){ return done.indexOf(id) < 0; });
  }
  function markRenfortDone(id){
    var boosts = getBoosts();
    Object.keys(boosts).forEach(function(level){
      var b = boosts[level];
      if(b && b.renfort && b.renfort.indexOf(id) >= 0){ b.done = (b.done || []); if(b.done.indexOf(id) < 0) b.done.push(id); setBoost(level, b); }
    });
  }

  // ---------- Titres des leçons (calculés une fois au démarrage) ----------
  var LESSON_TITLES = {};
  function computeLessonTitles(){
    var keep = state.lesson, keepDraw = state.ctrlDraw;
    A1_IDS.concat(A2_IDS).forEach(function(i){
      state.lesson = i; loadLessonData();
      var t = ((META && META.vocabTitle) || "").replace(/\s*\((?:A1|A2)\.\d+\)\s*$/, "");
      LESSON_TITLES[i] = (i === -1 ? "Fondamentaux" : (i >= 13 ? "A2." + (i - 13) : "A1." + (i + 1))) + (t && i !== -1 ? " · " + t : "");
    });
    state.lesson = keep; state.ctrlDraw = keepDraw;
  }
  function lessonTitle(id){ return LESSON_TITLES[id] || ("Leçon " + id); }
  function publishTitles(){ lsSet("the_roots_lesson_titles_v1", LESSON_TITLES); }

  // ---------- Évaluation d'un contrôle ----------
  function ctrlEvaluate(){
    var sk = { co:[0,0], ce:[0,0], gv:[0,0], ee:[0,0] }, miss = {}, missBySkill = { co:{}, ce:{}, gv:{}, ee:{} };
    function addMiss(k, id){ if(id == null) return; miss[id] = (miss[id] || 0) + 1; missBySkill[k][id] = (missBySkill[k][id] || 0) + 1; }
    QUIZ.forEach(function(q, i){ var k = q.cat === "oral" ? "co" : (q.cat === "comprehension" ? "ce" : "gv"); sk[k][1]++; if(state.quizLog[i]) sk[k][0]++; else addMiss(k, q._lesson); });
    ROUNDS.forEach(function(r, i){ sk.ee[1]++; if(state.gcExprLog[i]) sk.ee[0]++; else addMiss("ee", r._lesson); });
    var total = state.quizScore + state.gcExprScore, max = QUIZ.length + ROUNDS.length;
    var pct = Math.round(total / max * 100);
    var skills = {};
    Object.keys(sk).forEach(function(k){ skills[k] = sk[k][1] ? Math.round(sk[k][0] / sk[k][1] * 100) : null; });
    function top(obj, n){ return Object.keys(obj).map(Number).sort(function(a, b){ return obj[b] - obj[a]; }).slice(0, n); }
    var weak = top(miss, 4);
    var decision = pct < 70 ? "fail" : (pct < 80 ? "renfort" : (pct < 93 ? "rappel" : "net"));
    var floor = Object.keys(skills).filter(function(k){ return skills[k] != null && skills[k] < 50; });
    var floorLessons = [];
    floor.forEach(function(k){ top(missBySkill[k], 2).forEach(function(id){ if(floorLessons.indexOf(id) < 0) floorLessons.push(id); }); });
    return { pct:pct, total:total, max:max, skills:skills, weak:weak, decision:decision, floor:floor, floorLessons:floorLessons };
  }
  function saveControlResult(level, ev){
    var all = lsGet(K_CTRL, {}), m = all[LANG] || {}, rec = m[level] || { attempts:0, passed:false };
    rec.attempts += 1;
    rec.last = { at:Date.now(), pct:ev.pct, decision:ev.decision, skills:ev.skills, weak:ev.weak, floor:ev.floor };
    if(ev.decision !== "fail"){ rec.passed = true; rec.passedAt = rec.passedAt || Date.now(); rec.best = Math.max(rec.best || 0, ev.pct); }
    m[level] = rec; all[LANG] = m; lsSet(K_CTRL, all);
    if(ev.decision !== "fail"){
      var target = nextLevelOf(level), b = getBoosts()[target] || { renfort:[], rappel:[], done:[] };
      var add = function(list, ids){ ids.forEach(function(id){ if(list.indexOf(id) < 0) list.push(id); }); };
      if(ev.decision === "renfort") add(b.renfort, ev.weak);
      if(ev.decision === "rappel") add(b.rappel, ev.weak);
      add(b.renfort, ev.floorLessons);
      b.from = level; b.at = Date.now();
      setBoost(target, b);
    }
  }
  function controlRecord(level){ return ((lsGet(K_CTRL, {})[LANG]) || {})[level] || null; }
  // Nouveau passage après un échec : 7 jours après ET leçons à revoir refaites (réussies) depuis.
  function retakeStatus(level){
    var rec = controlRecord(level);
    if(!rec || !rec.last || rec.last.decision !== "fail") return { ok:true };
    var passes = (lsGet(K_PASS, {})[LANG]) || {};
    var todo = (rec.last.weak || []).filter(function(id){ return !(passes[id] > rec.last.at); });
    var openAt = rec.last.at + 7 * DAY_MS;
    var ok = CREATOR_MODE || (Date.now() >= openAt && todo.length === 0);
    return { ok:ok, todo:todo, openAt:openAt, creator:CREATOR_MODE };
  }
  function reviewButtonsHtml(ids, returnTo){
    return ids.map(function(id){ return '<button class="opt review-lesson" data-id="'+id+'" data-return="'+returnTo+'" style="text-align:left">↺ Revoir '+lessonTitle(id)+'</button>'; }).join("");
  }
  function wireReviewButtons(){
    Array.prototype.forEach.call(screen.querySelectorAll(".review-lesson"), function(b){
      b.addEventListener("click", function(){
        state.returnTo = parseInt(b.getAttribute("data-return"), 10);
        state.lesson = parseInt(b.getAttribute("data-id"), 10);
        state.step = 0; state.subStep = 0; state.quizIndex = 0; state.quizScore = 0; state.quizLog = [];
        state.ctrlDraw = null; memState = null; sbRound = 0; vocabBlockIdx = 0;
        render();
      });
    });
  }

  // ---------- Écran « renforts » avant le niveau suivant ----------
  function screenRenfortGate(todo){
    postmark.innerHTML = "RENFORT";

  // ---------- Mode entraînement (missions, « J'ai 5 minutes ») ----------
  // lessons.html#practice=auto  → mission du jour (leçons avec des erreurs à revoir aujourd'hui)
  // lessons.html#practice=mix   → 8 questions au hasard parmi les leçons déjà faites
  // lessons.html#practice=3,8   → questions des leçons 3 et 8
  var PRACTICE = null;
  (function(){
    var m = /practice=([^&]+)/.exec(location.hash || "");
    if(!m) return;
    PRACTICE = { mode:decodeURIComponent(m[1]), idx:0, score:0, log:[], built:false };
  })();
  function buildPractice(){
    var ids = [], mode = PRACTICE.mode;
    if(mode === "auto"){
      var errs = (lsGet(K_ERR, {})[LANG]) || {};
      ids = Object.keys(errs).map(Number).filter(function(id){ return errs[id].count > 0 && errs[id].due <= Date.now(); })
        .sort(function(a, b){ return errs[b].count - errs[a].count; }).slice(0, 2);
    } else if(mode === "mix"){
      var done = A1_IDS.concat(A2_IDS).filter(function(id){ return id < Math.min(state.lesson, 25) || (state.lesson === -1 && id === -1); });
      ids = shuffleArr(done.length ? done : [-1, 0]).slice(0, 3);
    } else {
      ids = mode.split(",").map(function(x){ return parseInt(x, 10); }).filter(function(x){ return !isNaN(x) && quizOf(x); });
    }
    var pool = [];
    ids.forEach(function(id){ (quizOf(id) || []).forEach(function(q){ pool.push(Object.assign({}, q, { _lesson:id })); }); });
    PRACTICE.ids = ids; PRACTICE.quiz = shuffleArr(pool).slice(0, 8); PRACTICE.built = true;
  }
  function renderPractice(){
    if(!PRACTICE.built) buildPractice();
    itinerary.hidden = true; backBtn.style.visibility = "hidden";
    postmark.innerHTML = "MISSION<br>5 MIN";
    var P = PRACTICE, Q = P.quiz[P.idx];
    if(!P.quiz.length){
      screen.innerHTML = '<div class="eyebrow">Mission du jour</div><h2 class="screen-title">Rien à retravailler aujourd\'hui 🎉</h2><p class="lede">Aucune erreur en attente : continue tes leçons, ou reviens demain.</p>';
      nextBtn.style.display = ""; nextBtn.textContent = "Retour à l'appli"; hint.textContent = "";
      return;
    }
    if(P.idx >= P.quiz.length){ return renderPracticeEnd(); }
    var cat = Q.cat || "ecrit";
    screen.innerHTML =
      '<div class="eyebrow">'+(P.mode === "auto" ? "Mission de récupération" : "Entraînement express")+' · '+lessonTitle(Q._lesson)+'</div>' +
      '<div class="q-progress"><span>Question '+(P.idx+1)+' / '+P.quiz.length+'</span><span class="q-cat '+cat+'">'+Q_CAT_LABEL[cat]+'</span></div>' +
      '<div class="q-text">'+Q.q+'</div>' +
      (Q.passage ? '<div class="q-passage">'+Q.passage+'</div>' : "") +
      (Q.audio ? '<div class="q-audio"><button class="q-audio-btn" id="qAudioBtn" aria-label="Écouter">🔊</button><span class="q-audio-hint">Écoute avant de répondre.</span></div>' : "") +
      '<div class="options" id="opts"></div><div id="qWhyWrap"></div>';
    if(Q.audio) document.getElementById("qAudioBtn").addEventListener("click", function(){ speak(Q.audio); });
    nextBtn.style.display = "none"; hint.textContent = "";
    var opts = document.getElementById("opts"), attempts = 0, resolved = false;
    Q.opts.forEach(function(opt, i){
      var b = document.createElement("button");
      b.className = "opt"; b.textContent = opt;
      b.addEventListener("click", function(){
        if(resolved || b.disabled) return;
        if(looksEnglish(opt)) speak(opt);
        attempts++;
        if(i === Q.correct){
          markOption(b, "correct"); resolved = true;
          Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
          var first = attempts === 1; P.log[P.idx] = first; if(first) P.score++;
          recordSkill(skillOfQ(Q), first);
          setTimeout(function(){ P.idx++; renderPractice(); }, 650);
        } else if(attempts >= 2){
          markOption(b, "incorrect"); markOption(opts.children[Q.correct], "correct"); resolved = true;
          Array.prototype.forEach.call(opts.children, function(o){ o.disabled = true; });
          P.log[P.idx] = false; recordSkill(skillOfQ(Q), false);
          document.getElementById("qWhyWrap").innerHTML = '<div class="why-inline"><span class="icon">💡</span><div>'+Q.why+'</div></div><button class="btn btn-primary" id="qContinue" style="margin-top:12px">Suivant</button>';
          document.getElementById("qContinue").addEventListener("click", function(){ P.idx++; renderPractice(); });

  function renderPracticeEnd(){
    var P = PRACTICE;

      P.saved = true;
      // Missions : une leçon réussie sans faute passe à l'étape suivante (demain → dans 7 jours →
      // acquise) ; sinon elle revient demain.
      var all = lsGet(K_ERR, {}), m = all[LANG] || {};
      P.ids.forEach(function(id){
        var qs = []; P.quiz.forEach(function(q, i){ if(q._lesson === id) qs.push(P.log[i]); });

        var clean = qs.every(function(x){ return x; });

        else { m[id].stage = 0; m[id].due = Date.now() + DAY_MS; }
      });

  var descState = { lesson:null, text:"", hints:0, checked:false, recorded:false, usedMic:false };
  function screenDescribe(){
    if(descState.lesson !== state.lesson) descState = { lesson:state.lesson, text:"", hints:0, checked:false, recorded:false, usedMic:false };
    var S = IMG.scene;
    backBtn.style.visibility = "visible";
    postmark.innerHTML = "DÉCRIS<br>L'IMAGE";
    nextBtn.textContent = "Passer au contrôle";
    hint.textContent = "";
    screen.innerHTML =
      '<div class="eyebrow">'+lessonLabel()+' · Décris l\'image</div>' +
      '<h2 class="screen-title">Qu\'est-ce que tu vois ?</h2>' +
      photoHtml(S, "px-scene") +
      '<p class="lede">'+S.prompt+' <b>2 ou 3 phrases en anglais</b>, à l\'écrit ou au micro.</p>' +
      '<textarea class="desc-area" id="descText" placeholder="There is… / There are… / They are…">'+escAttr(descState.text)+'</textarea>' +
      '<div class="desc-actions">' +
        (micSupported ? '<button class="btn btn-ghost" id="descMic">🎤 Dicter</button>' : "") +
        '<button class="btn btn-ghost" id="descHint">💡 Un indice</button>' +
        '<button class="btn btn-primary" id="descCheck" style="margin-left:0">✓ Vérifier</button>' +
      '</div>' +
      '<div id="descHints">'+descHintsHtml()+'</div>' +
      '<div id="descResult">'+(descState.checked ? descResultHtml() : "")+'</div>';
    var ta = document.getElementById("descText");
    ta.addEventListener("input", function(){ descState.text = ta.value; });
    document.getElementById("descHint").addEventListener("click", function(){
      descState.hints = Math.min(3, descState.hints + 1);
      document.getElementById("descHints").innerHTML = descHintsHtml();
    });
    document.getElementById("descCheck").addEventListener("click", function(){
      descState.text = ta.value; descState.checked = true;
      var r = descEvaluate();
      if(!descState.recorded && descState.text.trim()){
        descState.recorded = true;
        recordSkill("ee", r.ratio >= 0.6);
        if(descState.usedMic) recordSkill("eo", r.ratio >= 0.6);
      }
      document.getElementById("descResult").innerHTML = descResultHtml();
    });
    var mic = document.getElementById("descMic");
    if(mic) mic.addEventListener("click", function(){
      try {
        window.speechSynthesis && window.speechSynthesis.cancel();
        var rec = new SpeechRec();
        rec.lang = state.variant === "us" ? "en-US" : "en-GB";
        rec.interimResults = false; rec.maxAlternatives = 1;
        mic.textContent = "🎙️ Je t'écoute…";
        rec.onresult = function(e){
          var said = e.results[0][0].transcript;
          descState.usedMic = true;
          descState.text = (ta.value.trim() ? ta.value.trim() + " " : "") + said.charAt(0).toUpperCase() + said.slice(1) + ".";
          ta.value = descState.text;
        };
        rec.onend = function(){ mic.textContent = "🎤 Dicter"; };
        rec.onerror = function(){ mic.textContent = "🎤 Dicter"; };
        rec.start();
      } catch(err){ mic.textContent = "🎤 Dicter"; }
    });
  }
  function descHintsHtml(){
    var S = IMG.scene, h = descState.hints;
    if(!h) return "";
    var out = '<div class="desc-hint"><b>Indice 1 — de quoi parler :</b> ' + S.keywords.map(function(k){ return k.label; }).join(" · ") + '</div>';
    if(h >= 2) out += '<div class="desc-hint"><b>Indice 2 — des mots utiles :</b> ' + S.keywords.map(function(k){ return "<i>"+k.words[0]+"</i>"; }).join(", ") + '</div>';
    if(h >= 3) out += '<div class="desc-hint"><b>Indice 3 — le début des phrases :</b> ' + S.model.split(/[.!?]\s+/).filter(Boolean).map(function(s){ return "<i>"+s.split(" ").slice(0, 3).join(" ")+"…</i>"; }).join(" ") + '</div>';
    return out;
  }
  function descEvaluate(){
    var txt = " " + (descState.text || "").toLowerCase().replace(/[^a-z' ]+/g, " ") + " ";
    var res = IMG.scene.keywords.map(function(k){
      return { label:k.label, met:k.words.some(function(w){ return txt.indexOf(" " + w.toLowerCase() + " ") >= 0 || txt.indexOf(" " + w.toLowerCase()) >= 0; }) };
    });
    var met = res.filter(function(x){ return x.met; }).length;
    return { res:res, met:met, ratio: res.length ? met / res.length : 0 };
  }
  function descResultHtml(){
    if(!(descState.text || "").trim()) return '<div class="desc-hint">Écris ou dicte au moins une phrase, puis touche « Vérifier ».</div>';
    var r = descEvaluate();
    var verdict = r.ratio >= 0.8 ? "Très complet, bravo !" : r.ratio >= 0.6 ? "Bien : l'essentiel y est." : r.ratio > 0 ? "C'est un début : ajoute ce qui manque." : "On ne retrouve pas encore les éléments de la photo.";
    return '<div class="desc-result"><div class="desc-verdict">'+verdict+' ('+r.met+'/'+r.res.length+')</div>' +
      r.res.map(function(x){ return '<div class="desc-item '+(x.met ? "ok" : "ko")+'">'+(x.met ? "✓" : "○")+' '+x.label+'</div>'; }).join("") +
      '<div class="desc-model"><b>Exemple de réponse :</b> <button class="say-line" data-say="'+escAttr(IMG.scene.model)+'">🔊</button><br>'+IMG.scene.model+'</div>' +
      '<div class="lede" style="margin-top:6px">Ta phrase peut être différente et juste : ce qui compte, c\'est de dire qui, où et ce qui se passe.</div></div>';
  }
  // Clics communs : 🔊 d'une phrase, cartes de découverte, texte et image de vérification.
  document.addEventListener("click", function(e){
    var say = e.target.closest && e.target.closest("[data-say]");
    if(say){ speak(say.getAttribute("data-say")); return; }
    var disc = e.target.closest && e.target.closest("[data-disc]");
    if(disc && IMG && IMG.discover){ var d = IMG.discover[+disc.getAttribute("data-disc")]; disc.classList.add("seen"); if(d) speak(d.en); return; }
    if(e.target.id === "showText"){
      state.readShown = state.lesson;
      var w = document.getElementById("readingWrap"); if(w) w.hidden = false;
      e.target.remove();
      var cue = screen.querySelector(".why-inline"); if(cue) cue.remove();
      return;
    }
    if(e.target.id === "showCheck"){
      var c = document.getElementById("checkWrap"); if(c) c.hidden = false;
      e.target.remove();
    }
  });

  // Voix préférée choisie dans Paramètres > Réglages généraux > Voix (app
  // principale) : gardée sous forme "nom|langue" dans le store partagé
  // (localStorage "the_roots_store_v1"), relue ici pour que lessons.html
  // utilise la même voix plutôt que de toujours forcer l'accent britannique.
  function preferredVoiceKey(){
    try{
      var raw = localStorage.getItem("the_roots_store_v1");
      if(!raw) return null;
      var data = JSON.parse(raw);
      return (data && data.settings && data.settings.preferredVoiceURI) || null;

  function speak(text){
    try{
      if(!window.speechSynthesis) return;
      var u = new SpeechSynthesisUtterance(text);
      // Bug corrigé : cette fonction (utilisée pour QUASI tout l'audio de la
      // leçon — vocabulaire, quiz, exemples...) forçait toujours l'accent
      // britannique "en-GB", même quand l'apprenant suit le cours en anglais
      // AMÉRICAIN (state.variant === "us") — seul le bouton "Tout écouter"
      // (readAllBtn, plus bas) tenait compte du variant choisi. Les deux
      // utilisent maintenant exactement la même logique : la voix choisie
      // dans Paramètres si elle existe, sinon l'accent du variant suivi.
      var variantLang = state.variant === "us" ? "en-US" : "en-GB";
      u.lang = variantLang;
      var chosen = null;
      var key = preferredVoiceKey();
      if(key){
        var parts = key.split("|");
        var name = parts[0], voiceLang = parts[1];
        chosen = cachedVoices.find(function(v){ return v.name === name && v.lang === voiceLang; });
      }
      if(!chosen){
        chosen = cachedVoices.find(function(v){ return v.lang === variantLang; }) ||

      }
      if(chosen){ u.voice = chosen; u.lang = chosen.lang; }
      u.rate = 0.92;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}

  var vocabBlockIdx = 0;
  var MAX_VOCAB_PER_PAGE = 5;
  // Une "page" = un bloc thématique, ou un morceau de bloc si celui-ci dépasse MAX_VOCAB_PER_PAGE
  // mots (ex : Leçon 9 "Réservation et billets" a 8 mots -> 2 pages), pour ne jamais faire défiler
  // trop longtemps sur mobile même quand un seul thème est chargé.
  function vocabBlocks(){
    var blockNames = [];
    VOCAB.forEach(function(v){
      var key = v.block || null;
      if(blockNames.indexOf(key) === -1) blockNames.push(key);
    });
    var pages = [];
    blockNames.forEach(function(bn){
      var items = VOCAB.filter(function(v){ return (v.block || null) === bn; });
      var partTotal = Math.ceil(items.length / MAX_VOCAB_PER_PAGE) || 1;
      for(var i = 0; i < items.length; i += MAX_VOCAB_PER_PAGE){
        pages.push({ block: bn, items: items.slice(i, i+MAX_VOCAB_PER_PAGE), partIdx: Math.floor(i/MAX_VOCAB_PER_PAGE), partTotal: partTotal });
      }
    });
    return pages.length ? pages : [{ block:null, items:VOCAB, partIdx:0, partTotal:1 }];
  }

  // ---------- Dictionnaire cumulatif (pour la traduction au clic dans les textes de lecture) ----------
  // Fusionne tout le vocabulaire (VOCAB_L1..L12) et tous les glossaires (GLOSS_L1..L12) déjà écrits
  // dans l'appli, pour que n'importe quel mot déjà enseigné (dans cette leçon ou une leçon antérieure)
  // reste traduisible au clic dans n'importe quel texte de lecture, sans dépendre d'une liste
  // "mots à connaître" ressaisie à la main à chaque leçon.
  var GLOSS_DICT = null;
  function buildGlossDict(){
    if(GLOSS_DICT) return GLOSS_DICT;
    var dict = {};
    function addEntry(enRaw, frRaw){
      if(!enRaw || !frRaw) return;
      var enClean = enRaw.replace(/\s*\([^)]*\)/g, "").trim();
      var frClean = frRaw.replace(/\s*\([^)]*\)/g, "").trim();
      var ens = enClean.split("/").map(function(x){ return x.trim(); });
      var frs = frClean.split("/").map(function(x){ return x.trim(); });
      ens.forEach(function(e, i){
        var val = frs[i] || frs[0];
        var key = e.toLowerCase();
        if(key && !dict[key]) dict[key] = val;
        var bare = key.replace(/^to\s+/, "");
        if(bare !== key && !dict[bare]) dict[bare] = val;
      });
    }
    var vocabArrays = [VOCAB_L1,VOCAB_L2,VOCAB_L3,VOCAB_L4,VOCAB_L5,VOCAB_L6,VOCAB_L7,VOCAB_L8,VOCAB_L9,VOCAB_L10,VOCAB_L11,VOCAB_L12,
      VOCAB_A2_0,VOCAB_A2_1,VOCAB_A2_2,VOCAB_A2_3,VOCAB_A2_4,VOCAB_A2_5,VOCAB_A2_6,VOCAB_A2_7,VOCAB_A2_8,VOCAB_A2_9,VOCAB_A2_10,VOCAB_A2_11];
    var glossArrays = [GLOSS_L1,GLOSS_L2,GLOSS_L3,GLOSS_L4,GLOSS_L5,GLOSS_L6,GLOSS_L7,GLOSS_L8,GLOSS_L9,GLOSS_L10,GLOSS_L11,GLOSS_L12,GLOSS_COMMON,
      GLOSS_A2_0,GLOSS_A2_1,GLOSS_A2_2,GLOSS_A2_3,GLOSS_A2_4,GLOSS_A2_5,GLOSS_A2_6,GLOSS_A2_7,GLOSS_A2_8,GLOSS_A2_9,GLOSS_A2_10,GLOSS_A2_11];
    vocabArrays.forEach(function(arr){ (arr||[]).forEach(function(v){ addEntry(v.en, v.fr); }); });

  function lookupPhrase(dict, phrase){
    if(dict[phrase]) return dict[phrase];
    if(phrase.slice(-3) === "ing" && dict[phrase.slice(0,-3)]) return dict[phrase.slice(0,-3)];
    if(phrase.slice(-3) === "ing" && dict[phrase.slice(0,-3)+"e"]) return dict[phrase.slice(0,-3)+"e"];
    if(phrase.slice(-2) === "es" && dict[phrase.slice(0,-2)]) return dict[phrase.slice(0,-2)];
    if(phrase.slice(-1) === "s" && dict[phrase.slice(0,-1)]) return dict[phrase.slice(0,-1)];
    return null;
  }
  // Découpe une phrase et enveloppe chaque mot/expression reconnu(e) du dictionnaire cumulatif
  // dans un <span> cliquable qui affiche sa traduction (jusqu'à 3 mots, le plus long d'abord,
  // pour ne jamais traduire un fragment d'une expression composée comme "meet up").
  function glossifySentence(s){
    var dict = buildGlossDict();
    var tokens = s.match(/[A-Za-z'-]+|[^A-Za-z'-]+/g) || [s];
    var wordIdxs = [];
    tokens.forEach(function(t, i){ if(/[A-Za-z]/.test(t)) wordIdxs.push(i); });
    var used = {};
    var htmlTokens = tokens.map(function(){ return null; });
    for(var wi = 0; wi < wordIdxs.length; wi++){
      if(used[wordIdxs[wi]]) continue;
      for(var span = 3; span >= 1; span--){
        if(wi + span > wordIdxs.length) continue;
        var idxs = wordIdxs.slice(wi, wi+span);
        if(idxs.some(function(ix){ return used[ix]; })) continue;
        var phrase = idxs.map(function(ix){ return tokens[ix]; }).join(" ").toLowerCase();
        var fr = lookupPhrase(dict, phrase);
        if(fr){
          var startTok = idxs[0], endTok = idxs[idxs.length-1];
          var display = tokens.slice(startTok, endTok+1).join("");
          var frEsc = fr.replace(/"/g, "&quot;");
          htmlTokens[startTok] = '<span class="gloss-word" data-fr="'+frEsc+'">'+display+'</span>';
          for(var k = startTok+1; k <= endTok; k++){ htmlTokens[k] = ""; used[k] = true; }
          used[idxs[0]] = true;
          break;
        }
      }
    }
    return tokens.map(function(t, i){ return htmlTokens[i] !== null ? htmlTokens[i] : t; }).join("");
  }

  function attemptPronunciation(expected, statusEl, micBtn, replayBtn){
    if(!micSupported || !micStream){
      statusEl.textContent = "—";
      statusEl.title = "Autorise d'abord le micro ci-dessus";
      return;
    }
    var prevLabel = micBtn.textContent;
    micBtn.disabled = true;
    micBtn.textContent = "🎙️";
    statusEl.textContent = "…";

    // Enregistrement pour pouvoir se réécouter
    var recorder = null, chunks = [];
    if(canRecord){
      try{
        recorder = new MediaRecorder(micStream);
        recorder.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
        recorder.onstop = function(){
          if(chunks.length){
            var blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
            var url = URL.createObjectURL(blob);
            replayBtn.disabled = false;
            replayBtn.onclick = function(){ new Audio(url).play(); };
          }
        };
        recorder.start();
      }catch(e){ recorder = null; }
    }

    function finish(ok){
      statusEl.textContent = ok === null ? "—" : (ok ? "✓" : "✗");
      statusEl.className = "pron-status" + (ok === true ? " ok" : ok === false ? " bad" : "");
      micBtn.disabled = false;
      micBtn.textContent = prevLabel;
      if(recorder && recorder.state !== "inactive") recorder.stop();
    }

    try{
      var rec = new SpeechRec();
      rec.lang = state.variant === "us" ? "en-US" : "en-GB";
      rec.maxAlternatives = 3;
      var finished = false;
      rec.onresult = function(e){
        finished = true;
        var said = (e.results[0][0].transcript || "").toLowerCase().replace(/[.,!?]/g,"").trim();
        var exp = expected.toLowerCase().replace(/[.,!?]/g,"").trim();
        finish(said.indexOf(exp) !== -1 || exp.indexOf(said) !== -1);
      };
      rec.onerror = function(){ finished = true; finish(null); };
      rec.onend = function(){ if(!finished) finish(null); };
      rec.start();
    }catch(err){
      finish(null);
    }

    setTimeout(function(){ if(recorder && recorder.state !== "inactive") recorder.stop(); }, 4000);
  }

  function flip(idx){
    if(memState.open.indexOf(idx) !== -1 || memState.matched.indexOf(idx) !== -1) return;
    if(memState.open.length === 2) return;

      var a = memState.cards[memState.open[0]], b = memState.cards[memState.open[1]];

        }, 700);

    }

          markOption(b, "correct");

            var firstTry = attempts === 1;

            onQuizAnswered(Q, firstTry);

          pendingAutoAdvance = setTimeout(goNext, 650);

          markOption(b, "incorrect");

  function grantAiCredit(){
    try {
      var KEY = "the_roots_ai_v1";
      var data = JSON.parse(localStorage.getItem(KEY) || "null") || { credits: [], active: null, welcomeGiven: false };
      if(!Array.isArray(data.credits)) data.credits = [];
      var id = "en-" + state.lesson;
      if(data.credits.some(function(c){ return c.id === id; })) return false;
      var d = new Date();
      var today = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
      data.credits.push({ id: id, lang: "en", level: state.lesson >= 13 ? "A2" : "A1",
        topic: lessonLabel() + (META && META.vocabTitle ? " — " + META.vocabTitle : ""),
        lede: (META && META.todayLede) || "", earnedAt: today, usedAt: null });
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch(e){ return false; }
  }

    { q:"Comment dit-on « se retrouver » ?", opts:["Meet up","Break up"], correct:0, fb:"« Meet up » = se retrouver. (rappel A2.10)" }
  ];

  // ---------- Grand Contrôle de fin de niveau A2 (A2.12 "Imprévus en voyage") ----------
  // Comme pour le Grand Contrôle A1 : structure identique, contenu entièrement réécrit (jamais de
  // copier-coller des leçons). A2.12 mobilise vocabulaire aéroport/urgences/objets perdus et "What
  // if...?", et sert AUSSI de révision globale de A2.0 à A2.11 — d'où l'absence de VOCAB/GRAMMAR
  // séparés pour cette leçon (comme pour le Grand Contrôle A1), tout est intégré au contrôle lui-même.
  var GC_QUIZ_A2 = null, GC_ROUNDS_A2 = null;
  function buildGrandControleA2(){
    if(GC_QUIZ_A2) return;

    // Compréhension écrite + orale (/15) + vocabulaire du thème "Imprévus en voyage" (aéroport,
    // urgences, objets perdus, demander de l'aide) + Grammaire/vocabulaire de A2.0 à A2.11 (/10).
    GC_QUIZ_A2 = [
      { cat:"oral", audio:"Did you go to the airport yesterday?", q:"Écoute : de quand parle-t-on ?", opts:["D'aujourd'hui","D'hier","De demain","De la semaine prochaine"], correct:1, why:"« Did » + base verbale interroge sur une action terminée dans le passé (A2.0)." },
      { cat:"oral", audio:"I used to travel a lot, but I don't travel anymore.", q:"Écoute : que fait la personne aujourd'hui ?", opts:["Elle voyage toujours autant","Elle ne voyage plus, ou beaucoup moins","Elle vient de commencer à voyager","Elle déteste voyager"], correct:1, why:"« used to » = habitude passée qui n'est plus vraie aujourd'hui (A2.2)." },
      { cat:"oral", audio:"I was checking in when I heard my name on the speakers.", q:"Écoute : que faisait la personne quand elle a entendu son nom ?", opts:["Elle dormait","Elle s'enregistrait","Elle mangeait","Elle conduisait"], correct:1, why:"Past Continuous = action en cours interrompue (A2.3)." },
      { cat:"oral", audio:"I'm going to report my lost suitcase at the lost property office.", q:"Écoute : que va faire la personne ?", opts:["Acheter un billet","Déclarer une valise perdue","Annuler son vol","Réserver un hôtel"], correct:1, why:"« report my lost suitcase » = déclarer sa valise perdue (going to = projet déjà décidé, A2.4)." },
      { cat:"oral", audio:"This airport is much busier than the last one.", q:"Écoute : que compare-t-on ?", opts:["Deux aéroports","Deux avions","Deux pays","Deux vols"], correct:0, why:"Le comparatif « busier than » compare deux aéroports (A2.5)." },
      { cat:"oral", audio:"You should ask a member of staff for help.", q:"Écoute : quel type de conseil entend-on ?", opts:["Une obligation stricte","Un conseil","Une interdiction","Une prédiction"], correct:1, why:"« should » = un conseil (A2.6)." },
      { cat:"oral", audio:"If the flight is delayed, we'll miss our connection.", q:"Écoute : que se passera-t-il si le vol est retardé ?", opts:["Rien du tout","Ils rateront leur correspondance","Ils arriveront plus tôt","Ils changeront de destination"], correct:1, why:"« If + présent, ... will » = condition et conséquence (A2.7)." },
      { cat:"oral", audio:"There aren't any seats available near the gate.", q:"Écoute : que cherche-t-on en vain ?", opts:["Des sièges près de la porte d'embarquement","Un distributeur","Une pharmacie","Un guichet"], correct:0, why:"« any » dans une négation (A2.8)." },
      { cat:"oral", audio:"She said that she would arrive an hour late.", q:"Écoute : qu'a dit la personne à l'origine ?", opts:["« I will arrive an hour late »","« I arrived an hour late »","« I am an hour late »","« She arrived an hour late »"], correct:0, why:"Discours rapporté : « will » devient « would » (A2.9)." },
      { cat:"oral", audio:"Why don't we ask at the information desk?", q:"Écoute : que propose-t-on ?", opts:["D'annuler le voyage","De demander au comptoir d'information","D'attendre sans rien faire","De rentrer à la maison"], correct:1, why:"« Why don't we...? » propose une action (A2.10)." },
      { cat:"oral", audio:"To be honest, I was really worried when I lost my passport.", q:"Écoute : quel sentiment est exprimé ?", opts:["De l'inquiétude","Du soulagement","De la joie","De l'ennui"], correct:0, why:"« worried » = inquiet(ète) (A2.11)." },
      { cat:"comprehension", passage:"“Excuse me, could you help me? I think I've lost my suitcase. — Of course, let's go to the lost property office and report it right away.”", q:"D'après le dialogue, que va faire le personnel pour aider ?", opts:["Vendre un nouveau billet","Aller déclarer la valise perdue","Appeler la police","Annuler le vol"], correct:1, why:"« let's go to the lost property office and report it »." },
      { cat:"comprehension", passage:"“What if we miss our connecting flight? — Don't worry, if that happens, the airline will find us another one. — That's a relief!”", q:"D'après le dialogue, que fera la compagnie aérienne en cas de correspondance manquée ?", opts:["Rien du tout","Elle trouvera un autre vol","Elle remboursera le billet","Elle annulera le voyage"], correct:1, why:"« the airline will find us another one »." },
      { cat:"comprehension", passage:"“There was an emergency at the airport this morning — someone felt sick near the gate. Staff arrived quickly and everything was fine in the end, but for a moment, everyone was worried.”", q:"D'après le texte, que s'est-il passé ce matin à l'aéroport ?", opts:["Un vol a été annulé","Quelqu'un s'est senti mal","Une valise a été perdue","Un orage a retardé les vols"], correct:1, why:"« someone felt sick near the gate »." },
      { cat:"comprehension", passage:"“I was standing in line when I suddenly realised I couldn't find my passport. I checked my bag twice, and finally found it in my jacket pocket — what a relief!”", q:"D'après le texte, où la personne a-t-elle finalement trouvé son passeport ?", opts:["Dans sa valise","Dans la poche de sa veste","Au comptoir","Il ne l'a jamais retrouvé"], correct:1, why:"« finally found it in my jacket pocket »." },
      { cat:"comprehension", passage:"“Good morning, how can I help you? — Hi, could you help me? My flight was cancelled, and I'm not sure what to do next. — Don't worry, I'll check the next available flight for you right now.”", q:"D'après le dialogue, quel est le problème du voyageur/de la voyageuse ?", opts:["Une valise perdue","Un vol annulé","Un passeport perdu","Un retard de train"], correct:1, why:"« My flight was cancelled »." },

      // Grammaire + vocabulaire (/10) — un point de grammaire par palier A2.0 à A2.9, nouvel exemple à chaque fois.
      { cat:"ecrit", q:"Complète : “Yesterday, I ___ (go) to the airport very early.”", opts:["go","goed","went"], correct:2, why:"« go » est irrégulier : passé simple « went » (A2.0)." },
      { cat:"ecrit", q:"Complète : “I ___ (wait) at the gate when they announced the delay.” (Past Continuous)", opts:["wait","was waiting","waited"], correct:1, why:"Action en cours interrompue par une annonce → Past Continuous (A2.1/A2.3)." },
      { cat:"ecrit", q:"Comment dit-on « je voyageais souvent avant, mais plus maintenant » ?", opts:["I travel often","I used to travel often","I am travelling often"], correct:1, why:"« used to » = habitude passée disparue (A2.2)." },
      { cat:"ecrit", q:"Complète : “___ we miss the flight, we'll book another one.” (imprévu, hypothèse)", opts:["What if","Because","So"], correct:0, why:"« What if...? » envisage un imprévu ou une hypothèse inquiétante (A2.12)." },
      { cat:"ecrit", q:"Complète : “I ___ (go) to the check-in desk before boarding.” — projet déjà décidé.", opts:["will go","am going to go","go"], correct:1, why:"« going to » pour un projet déjà décidé avant de parler (A2.4)." },
      { cat:"ecrit", q:"Comment dit-on « cet aéroport est plus grand que celui-là » ?", opts:["This airport is bigger than that one.","This airport is the biggest.","This airport is as big as that one."], correct:0, why:"Le comparatif compare deux éléments entre eux (A2.5)." },
      { cat:"ecrit", q:"Complète : “You ___ ask a member of staff for help.” — un conseil.", opts:["should","have to"], correct:0, why:"« should » = conseil, pas obligation stricte (A2.6)." },
      { cat:"ecrit", q:"Complète : “If the flight is delayed, we ___ (miss) our connection.”", opts:["miss","will miss","missed"], correct:1, why:"« If + présent, ... will + base » exprime une conséquence probable (A2.7)." },
      { cat:"ecrit", q:"Complète : “There ___ any seats available near the gate.”", opts:["are","aren't"], correct:1, why:"« any » dans une négation (A2.8)." },
      { cat:"ecrit", q:"Il dit « I will help you » → comment rapporter au discours rapporté ?", opts:["He said that he will help me.","He said that he would help me."], correct:1, why:"« will » devient « would » au discours rapporté (A2.9)." }
    ]; // 15 compréhension + 10 grammaire/vocabulaire = 25 questions

    // Expression écrite + orale (/15) — nouvelles phrases sur le thème "Imprévus en voyage",
    // mobilisant les points de grammaire de A2.0 à A2.11.
    GC_ROUNDS_A2 = [
      { bank:["airport","the","went","We","early","to","."], answer:"we went to the airport early .", display:"We went to the airport early.", fr:"Nous sommes allés à l'aéroport tôt." },
      { bank:["used","fly","to","often","I","."], answer:"i used to fly often .", display:"I used to fly often.", fr:"Je prenais souvent l'avion, avant." },
      { bank:["called","when","my","phone","boarding","started","I","was","."], answer:"i was boarding when my phone called .", display:"I was boarding when my phone called.", fr:"J'étais en train d'embarquer quand mon téléphone a sonné." },
      { bank:["miss","if","the","We'll","flight","late","are","we","."], answer:"we'll miss the flight if we are late .", display:"We'll miss the flight if we are late.", fr:"Nous raterons le vol si nous sommes en retard." },
      { bank:["going","early","are","to","We","arrive","."], answer:"we are going to arrive early .", display:"We are going to arrive early.", fr:"Nous allons arriver tôt." },
      { bank:["one","that","is","This","airport","than","bigger","."], answer:"this airport is bigger than that one .", display:"This airport is bigger than that one.", fr:"Cet aéroport est plus grand que celui-là." },
      { bank:["help","should","for","staff","You","ask","."], answer:"you should ask staff for help .", display:"You should ask staff for help.", fr:"Tu devrais demander de l'aide au personnel." },
      { bank:["connection","we","the","delayed","miss","If","flight","the","is","we'll","."], answer:"if the flight is delayed we'll miss the connection .", display:"If the flight is delayed, we'll miss the connection.", fr:"Si le vol est retardé, nous raterons la correspondance." },
      { bank:["gate","near","any","aren't","There","seats","the","."], answer:"there aren't any seats near the gate .", display:"There aren't any seats near the gate.", fr:"Il n'y a aucun siège près de la porte d'embarquement." },
      { bank:["would","said","late","he","arrive","He","that","."], answer:"he said that he would arrive late .", display:"He said that he would arrive late.", fr:"Il a dit qu'il arriverait en retard." },
      { bank:["desk","ask","information","the","don't","we","at","Why","?"], answer:"why don't we ask at the information desk ?", display:"Why don't we ask at the information desk?", fr:"Pourquoi ne pas demander au comptoir d'information ?" },
      { bank:["worried","was","really","I","."], answer:"i was really worried .", display:"I was really worried.", fr:"J'étais vraiment inquiet(ète)." },
      { bank:["suitcase","miss","we","What","the","if","?"], answer:"what if we miss the suitcase ?", display:"What if we miss the suitcase?", fr:"Et si on ratait la valise ?" },
      { bank:["passport","help","you","lost","Could","my","I've","."], answer:"could you help i've lost my passport .", display:"Could you help? I've lost my passport.", fr:"Pourriez-vous m'aider ? J'ai perdu mon passeport." },
      { bank:["desk","report","at","it","lost","property","the","We","."], answer:"we report it at the lost property desk .", display:"We report it at the lost property desk.", fr:"Nous le déclarons au comptoir des objets perdus." }
    ]; // 15 manches = 15 points
  }

  function render(){
    if(PRACTICE){ renderPractice(); return; }
    loadLessonData();
    // Pendant une leçon revue à la demande d'un contrôle/renfort, on ne déplace pas la progression.
    if(state.returnTo == null){ try { localStorage.setItem(LESSON_KEY, String(state.lesson)); } catch(e){} }
    if(state.variant){ document.documentElement.setAttribute("data-flag", state.variant); }
    else { document.documentElement.removeAttribute("data-flag"); }
    updateRouteChip();
    nextBtn.style.display = "";
    nextBtn.disabled = false;
    state.gateOpen = false;
    if(state.lesson === 13 && state.step === 0 && !state.renfortSkipped && state.returnTo == null){
      var renfortTodo = pendingRenforts("A2");
      if(renfortTodo.length){ state.gateOpen = true; screenRenfortGate(renfortTodo); return; }
    }
    if(isGrandControle()){
      itinerary.hidden = true;
      postmark.innerHTML = state.lesson === GRAND_CONTROLE_A2_LESSON ? "GRAND<br>CTRL A2" : "GRAND<br>CONTRÔLE";
      if(state.step === 0) screenGCAccueil();
      else if(state.step === 1) renderSentenceBuilder();
      else if(state.step === 2) screenControle();
      else screenGCBilan();
      return;
    }
    itinerary.hidden = state.step === 0;
    renderItinerary();
    if(state.step === 0) screenAccueil();
    else if(state.step === 1) screenLecon();
    else if(state.step === 2) screenPrononciation();
    else if(state.step === 3) screenJeu();
    else if(state.step === 4) screenLecture();
    else if(state.step === 5) screenControle();
    else screenBilan();
  }

  var pendingAutoAdvance = null;
  function goNext(){
    if(pendingAutoAdvance){ clearTimeout(pendingAutoAdvance); pendingAutoAdvance = null; }
    if(PRACTICE){ backToApp(); return; }
    if(state.gateOpen){ state.gateOpen = false; state.renfortSkipped = true; render(); return; }
    if(isGrandControle()){
      if(state.step === 0){
        if(!retakeStatus(ctrlLevel()).ok) return;
        state.step = 1; sbRound = 0;
      } else if(state.step === 1 && sbRound < ROUNDS.length-1){
        sbRound++;
      } else if(state.step === 1){
        state.step = 2; state.quizIndex = 0; sbRound = 0;
      } else if(state.step === 2 && state.quizIndex < QUIZ.length-1){
        state.quizIndex++;
      } else if(state.step === 2){
        state.step = 3;
      } else if(state.step === 3){
        var ev = state.lastEval || ctrlEvaluate();
        var gcPassed = ev.decision !== "fail";
        state.quizIndex = 0; state.quizScore = 0; state.quizLog = [];
        state.gcExprScore = 0; state.gcExprLog = []; sbRound = 0;
        state.ctrlDraw = null; state.lastEval = null; // prochain passage = nouvelles questions
        if(gcPassed){
          if(state.lesson === GRAND_CONTROLE_LESSON){
            // A1 validé : on enchaîne sur le niveau A2 (A2.0), précédé des renforts éventuels.
            state.lesson = 13; state.step = 0; state.reviewDone = false; state.reviewLog = []; state.renfortSkipped = false;
          } else if(state.lesson === GRAND_CONTROLE_A2_LESSON){
            // A2 validé : place au grand contrôle final (A1 + A2).
            state.lesson = GRAND_CONTROLE_FINAL_LESSON; state.step = 0;
          } else {
            // Final validé : le niveau B1 n'existe pas encore → retour aux leçons pour réviser.
            state.lesson = 0; state.step = 0; state.reviewDone = true; state.reviewLog = [];
          }
        } else {
          // Pas validé : retour à l'accueil du contrôle (leçons à revoir + délai d'une semaine).
          state.step = 0;
        }
      }
      render();
      return;
    }
    if(state.step === 1 && state.subStep === 4 && sbRound < ROUNDS.length-1){
      sbRound++;
      render();
      return;
    }
    if(discoverPending()){ state.discoverSeen = state.lesson; render(); return; }
    if(state.step === 1 && state.subStep === 0 && vocabBlockIdx < vocabBlocks().length-1){
      vocabBlockIdx++;
      render();
      return;
    }
    if(state.step === 1 && state.subStep < LECON_SUBSTEPS-1){
      state.subStep++;
      if(state.subStep === 1){ vocabBlockIdx = 0; }
    } else if(state.step === 4 && state.subStep < LECTURE_SUBSTEPS-1){
      state.subStep++;
    } else if(state.step === 5 && state.quizIndex < QUIZ.length-1){
      state.quizIndex++;
    } else if(state.step === 6){
      var bilanPassed = state.quizScore >= Math.ceil(QUIZ.length * PASS_THRESHOLD_RATIO);
      if(bilanPassed && state.returnTo != null){
        // Leçon revue à la demande d'un contrôle ou d'un renfort : on y retourne.
        markRenfortDone(state.lesson);
        state.lesson = state.returnTo; state.returnTo = null; state.ctrlDraw = null;
      } else if(bilanPassed && state.lesson < GRAND_CONTROLE_A2_LESSON){
        state.lesson++;
        state.reviewDone = false; state.reviewLog = [];
        if(isGrandControle()){ state.gcExprScore = 0; state.gcExprLog = []; }
      }
      state.step = 0; state.subStep = 0; state.quizIndex = 0; state.quizScore = 0; state.quizLog = [];
      memState = null; sbRound = 0; vocabBlockIdx = 0;
    } else {
      state.step = Math.min(state.step+1, 6);
      state.subStep = 0;
    }
    render();
  }
  nextBtn.addEventListener("click", goNext);

  backBtn.addEventListener("click", function(){
    if(isGrandControle()){
      if(state.step === 1 && sbRound > 0){ sbRound--; render(); return; }
      if(state.step === 1 && sbRound === 0){ state.step = 0; render(); return; }
      return; // pas de retour arrière pendant le Contrôle ou depuis le Bilan (comme pour les leçons)
    }
    if(state.step === 1 && state.subStep === 4 && sbRound > 0){
      sbRound--;
      render();
      return;
    }
    if(state.step === 1 && state.subStep === 0 && vocabBlockIdx > 0){
      vocabBlockIdx--;
      render();
      return;
    }
    if(state.step === 1 && state.subStep === 0 && IMG && IMG.discover && state.discoverSeen === state.lesson){
      state.discoverSeen = null; render(); return;
    }
    if(state.step === 1 && state.subStep > 0){
      state.subStep--;
      if(state.subStep === 0){ vocabBlockIdx = vocabBlocks().length-1; }
    } else if(state.step === 4 && state.subStep > 0){
      state.subStep--;
    } else {
      state.step = Math.max(state.step-1, 0);
      state.subStep = 0;
      vocabBlockIdx = 0;
    }
    render();
  });

  computeLessonTitles();
  publishTitles();
  // lessons.html#renfort=3 (depuis Mes cours › Mes renforts) : refaire la leçon 3 en entier,
  // puis revenir à la leçon en cours ; la leçon réussie est cochée « renfort fait ».
  (function(){
    var m = /renfort=(-?\d+)/.exec(location.hash || "");
    if(!m || PRACTICE) return;
    var id = parseInt(m[1], 10);
    if(!quizOf(id)) return;
    try { history.replaceState(null, "", location.pathname); } catch(e){}
    state.returnTo = state.lesson; state.lesson = id; state.renfortSkipped = true;
    state.step = 0; state.subStep = 0; state.quizIndex = 0; state.quizScore = 0; state.quizLog = [];
    state.ctrlDraw = null; memState = null; sbRound = 0; vocabBlockIdx = 0;
  })();
  // Accès de test (uniquement si l'adresse contient #rootstest) — sans effet pour les utilisateurs.
  if(/rootstest/.test(location.hash || "")){
    window.__rootsTest = { state:state, render:render, goNext:goNext, quiz:function(){ return QUIZ; }, rounds:function(){ return ROUNDS; } };
  }
  render();

})();
</script>
